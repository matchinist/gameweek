// ── CS2 FANTASY: standalone pane (season-long, no gameweek rounds) ─────────
function renderFantasyPane(comp){
  const fd = comp.fantasyData;
  if(!fd) return '<div class="empty"><div class="empty-title">Fantasy data not configured</div></div>';
  const allPlayers={};
  fd.teams.forEach(t=>t.players.forEach(p=>{allPlayers[p.id]={...p,team:t.name,teamBg:t.bg,teamFg:t.fg,teamAbbr:t.abbr,teamLogoUrl:t.logoUrl};}));
  const roster=(fd.userRoster||[]).map(pid=>allPlayers[pid]).filter(Boolean);
  const totalKills=roster.reduce((s,p)=>s+p.kills,0);
  const totalSpent=roster.reduce((s,p)=>s+p.price,0);
  const budget=comp.fantasyConfig?.budget||50000;

  let html = `<div style="padding:12px 16px 0;">
    <div class="control-band">
      <div style="font-size:15px;font-weight:800;color:var(--text);margin-bottom:2px;">${comp.name}</div>
      <div style="font-size:12px;color:var(--text-2);">Pick 5 CS2 players from any playoff team within the $${budget.toLocaleString()} budget. Scored by total kills across the bracket.</div>
      <button class="ps-tab" onclick="showRules('fantasy')" style="border:1px solid var(--border);margin-top:10px;">Rules</button>
    </div>
  </div>`;

  html+=`<div style="padding:0 8px 12px;">`;
  html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 8px 10px;">
    <div><span style="font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text-3);">BUDGET</span>
      <span style="font-family:var(--mono);font-size:13px;font-weight:800;color:${totalSpent<=budget?'var(--green)':'var(--red)'};margin-left:6px;">$${(budget-totalSpent).toLocaleString()} left</span></div>
    <div style="display:flex;align-items:center;gap:6px;">
      <span style="font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text-3);">TOTAL KILLS</span>
      <span style="font-family:var(--mono);font-size:22px;font-weight:900;color:var(--accent);">${totalKills}</span>
    </div>
  </div>`;

  // Roster shown as 5 boxes side by side — filled slots plus dashed empty
  // placeholders for whatever's left, so it always reads as "5 shirt
  // numbers" rather than a growing list.
  html+=`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px;">`;
  roster.forEach(p=>{
    html+=`<div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 8px;background:var(--white);border-radius:10px;border:1px solid var(--border);">
      <button onclick="removeFantasyPlayer('${comp.id}','${p.id}')" style="position:absolute;top:3px;right:3px;background:none;border:none;cursor:pointer;color:var(--red);font-size:12px;padding:2px;line-height:1;">✕</button>
      ${fantasyBadge(p.teamBg,p.teamFg,p.teamAbbr,32,p.teamLogoUrl)}
      <div style="font-family:var(--mono);font-size:11px;font-weight:800;color:var(--text);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;">${p.name}</div>
      <div style="font-size:9px;color:var(--text-3);text-align:center;">$${(p.price/1000).toFixed(1)}k</div>
      <div style="font-family:var(--mono);font-size:15px;font-weight:900;color:var(--accent);">${p.kills}</div>
    </div>`;
  });
  for(let i=roster.length;i<5;i++){
    html+=`<button onclick="openFantasyPicker('${comp.id}')" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px 4px;border-radius:10px;border:1.5px dashed var(--border);background:transparent;color:var(--accent);cursor:pointer;min-height:104px;">
      <span style="font-size:20px;font-weight:300;line-height:1;">+</span>
      <span style="font-family:var(--mono);font-size:9px;font-weight:700;">Add</span>
    </button>`;
  }
  html+=`</div>`;

  html+=`<div style="font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text-3);padding:4px 8px 8px;">MATCHES</div>`;
  fd.matches.forEach(m=>{
    const isDone=m.status==='completed';
    html+=`<div style="background:var(--white);border-radius:10px;border:1px solid var(--border);margin-bottom:8px;overflow:hidden;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;${isDone?'':'opacity:0.5;'}">
        <div style="flex:1;text-align:center;">
          <div style="font-family:var(--mono);font-size:12px;font-weight:800;color:var(--text);">${m.team1}</div>
        </div>
        <div style="padding:0 12px;text-align:center;">
          <div style="font-size:9px;color:var(--text-3);margin-bottom:2px;">${m.stage}</div>
          <div style="font-family:var(--mono);font-size:16px;font-weight:900;color:${isDone?'var(--text)':'var(--text-3)'};">${m.score}</div>
        </div>
        <div style="flex:1;text-align:center;">
          <div style="font-family:var(--mono);font-size:12px;font-weight:800;color:var(--text);">${m.team2}</div>
        </div>
      </div>`;
    if(isDone&&m.maps.length){
      html+=`<div style="border-top:1px solid var(--border);padding:8px 12px;background:var(--bg);">`;
      html+=`<div style="display:flex;gap:8px;margin-bottom:6px;">${m.maps.map(mp=>`<span style="font-family:var(--mono);font-size:10px;color:var(--text-2);background:var(--white);padding:2px 8px;border-radius:4px;border:1px solid var(--border);">${mp.name} ${mp.score}</span>`).join('')}</div>`;
      if(m.topFrags.length){
        html+=`<div style="font-size:10px;color:var(--text-3);margin-bottom:4px;">Top performers</div>`;
        html+=`<div style="display:flex;gap:6px;flex-wrap:wrap;">`;
        m.topFrags.forEach(f=>{
          const isInRoster=(fd.userRoster||[]).some(pid=>{const pp=allPlayers[pid];return pp&&pp.name===f.name;});
          html+=`<span style="font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;${isInRoster?'background:var(--accent-light);color:var(--accent);border:1px solid var(--accent);':'background:var(--bg);color:var(--text-2);border:1px solid var(--border);'}">${f.name} ${f.kills}K</span>`;
        });
        html+=`</div>`;
      }
      html+=`</div>`;
    }
    html+=`</div>`;
  });

  html+=`</div>`;
  return html;
}

function renderPredictionsPane(comp){
  if(comp.mode==='lineup') return renderLineupPredictor(comp);
  if(comp.mode==='roulette'){ setTimeout(()=>initRouletteBoard(),50); return renderRouletteHTML(); }
  if(comp.mode==='fantasy') return renderFantasyPane(comp);
  const ri=selectedRound[currentCompIdx];
  const round=comp.rounds[ri];if(!round)return'';
  const isOpen=round.status==='open';
  let events=(round.eventIds||[]).map(id=>({id,...EVENTS[id]})).filter(e=>e.home);
  let nextScoreLock=null;
  if(comp.mode==='score'){
    const nowTs=Date.now();
    events.forEach(ev=>{
      const raw=ev.kickoffRaw||ev.kickoff;
      const ko=parseKickoffMs(raw);
      ev._scoreLockAt = ko!=null ? ko-30*60*1000 : null; // matches the real 30-min-before-kickoff gate in renderEventCard
    });
    const upcoming=events.filter(ev=>!ev.res&&ev._scoreLockAt!=null&&ev._scoreLockAt>nowTs).sort((a,b)=>a._scoreLockAt-b._scoreLockAt);
    if(upcoming.length) nextScoreLock=upcoming[0];
  }
  let nextBettingLock=null;
  if(comp.mode==='betting'){
    // Each event locks 30 min before its own kickoff, same rule as Score
    // Predictor — not every event in a betting round locks at once, so this
    // always reflects whichever upcoming event locks soonest.
    const nowTs=Date.now();
    events.forEach(ev=>{
      const raw=ev.kickoffRaw||ev.kickoff;
      const ko=parseKickoffMs(raw);
      ev._bettingLockAt = ko!=null ? ko-30*60*1000 : null; // matches the real 30-min-before-kickoff gate in renderEventCard
    });
    const upcoming=events.filter(ev=>!ev.res&&ev._bettingLockAt!=null&&ev._bettingLockAt>nowTs).sort((a,b)=>a._bettingLockAt-b._bettingLockAt);
    if(upcoming.length) nextBettingLock=upcoming[0];
  }
  let rankingRoundLockAt=null;
  if(comp.mode==='ranking'){
    // Ranking locks as a whole round, not event-by-event — 1 hour before the
    // FIRST assigned event's kickoff, since you're ranking the whole set of
    // teams together, not predicting each match individually.
    const kickoffs=events.map(ev=>parseKickoffMs(ev.kickoffRaw||ev.kickoff)).filter(ko=>ko!=null);
    if(kickoffs.length) rankingRoundLockAt = Math.min(...kickoffs) - 3600000;
  }
  let eliminatedAtIdx=-1;
  if(comp.mode==='lms'){
    for(let i=0;i<events.length;i++){
      const p=preds[events[i].id];
      if(events[i].res&&p){const actual=events[i].res.h>events[i].res.a?'H':events[i].res.h<events[i].res.a?'A':'D';if(p!==actual){eliminatedAtIdx=i;break;}}
    }
  }

  const predCount = events.filter(ev=>{const p=preds[ev.id];return p&&p.h!==undefined&&p.a!==undefined;}).length;

  // Control band: title + explainer + [round dropdown, Rules] ... [Predictions|Leaderboard]
  let html=controlBandOpen(comp,
    comp.rounds.map((r,i)=>`<option value="${i}"${i===ri?' selected':''}>${r.label}</option>`).join(''),
    `<button class="ps-tab${predictSubTab==='predictions'?' active':''}" onclick="switchPredictSubTab('predictions')">Predictions</button>
     <button class="ps-tab${predictSubTab==='leaderboard'?' active':''}" onclick="switchPredictSubTab('leaderboard')">Leaderboard</button>`,
    `<button class="ps-tab${predictSubTab==='predictions'?' active':''}" onclick="switchPredictSubTab('predictions')">Predictions</button><button class="ps-tab${predictSubTab==='leaderboard'?' active':''}" onclick="switchPredictSubTab('leaderboard')">Leaderboard</button>`);

  if(comp.mode==='lms'&&eliminatedAtIdx>=0){
    // Eliminated — shows immediately rather than waiting for the whole round
    // to finish, and takes priority over the generic countdown below.
    html+=`<div class="control-band-countdown" style="background:var(--bg);color:var(--text-2);">🔒 You've been eliminated <span style="color:var(--red);font-weight:700;"> · ✗ You failed!</span></div>`;
  } else if(comp.mode==='score'){
    if(isOpen&&nextScoreLock){
      html+=controlBandCountdown('⏱','Events lock','30 min before kick-off time', events.length?`${predCount} / ${events.length} set`:'');
    } else if(isOpen&&events.length&&events.every(ev=>ev.res||(ev._scoreLockAt!=null&&ev._scoreLockAt<=Date.now()))){
      html+=`<div class="control-band-countdown" style="background:var(--bg);color:var(--text-2);">🔒 All predictions locked</div>`;
    }
  } else if(comp.mode==='betting'){
    if(isOpen&&nextBettingLock){
      const setCount = events.filter(ev=>{const p=preds[ev.id];return p&&typeof p==='object'&&Object.keys(p).length>0;}).length;
      html+=controlBandCountdown('⏱','Events lock','30 min before kick-off time', events.length?`${setCount} / ${events.length} set`:'');
    } else if(isOpen&&events.length&&events.every(ev=>ev.res||(ev._bettingLockAt!=null&&ev._bettingLockAt<=Date.now()))){
      html+=`<div class="control-band-countdown" style="background:var(--bg);color:var(--text-2);">🔒 All predictions locked</div>`;
    }
  } else if(comp.mode==='ranking'){
    if(isOpen&&rankingRoundLockAt&&rankingRoundLockAt>Date.now()){
      // "Round locks in" (not "Locks in") since this is a single whole-round
      // deadline covering every team in the ranking, not one specific match.
      html+=controlBandCountdown('⏱','Round locks in','<span id="countdown-text">Calculating...</span>', '');
      setTimeout(()=>startCountdown(rankingRoundLockAt,()=>renderPredict()),50);
    } else if(isOpen&&rankingRoundLockAt&&rankingRoundLockAt<=Date.now()){
      html+=`<div class="control-band-countdown" style="background:var(--bg);color:var(--text-2);">🔒 Round locked</div>`;
    }
  } else if(!isOpen&&comp.mode==='lms'){
    let userStatus='';
    const resultedEvs=events.filter(ev=>ev.res);
    if(resultedEvs.length){
      let alive=true;
      for(const ev of resultedEvs){
        const p=preds[ev.id];
        if(!p){alive=false;break;}
        const actual=ev.res.h>ev.res.a?'H':ev.res.h<ev.res.a?'A':'D';
        if(p!==actual){alive=false;break;}
      }
      userStatus=alive?'<span style="color:var(--green);font-weight:700;"> · ✓ You survived!</span>':'<span style="color:var(--red);font-weight:700;"> · ✗ You failed!</span>';
    }
    html+=`<div class="control-band-countdown" style="background:var(--bg);color:var(--text-2);">🔒 Predictions locked${userStatus}</div>`;
  }
  html+='</div>';

  // ── RANKING MODE ────────────────────────────────────────────────────────
  if(comp.mode==='ranking'&&round.rankingTeams){
    const teams=round.rankingTeams;
    const predKey=round.id+'_ranking';
    const isCompleted=round.status==='completed';
    let userOrder=preds[predKey]||null;
    if(!userOrder){
      userOrder=teams.map(t=>t.id);
      preds[predKey]=userOrder;
    }

    // Get actual order for completed rounds
    let actualOrder=null;
    if(isCompleted){
      actualOrder=[...teams].sort((a,b)=>(rankVal(b)||0)-(rankVal(a)||0)).map(t=>t.id);
    }

    const teamMap={};teams.forEach(t=>{teamMap[t.id]=t;});

    // Calculate points for completed
    let totalPts=0,correctCount=0;
    if(actualOrder){
      userOrder.forEach((tid,i)=>{if(tid===actualOrder[i])correctCount++;});
      totalPts=correctCount*(comp.rankingConfig?.pointsPerCorrect||2);
      if(correctCount===teams.length)totalPts+=(comp.rankingConfig?.perfectBonus||5);
    }

    html+=`<div style="padding:0 8px 12px;">`;
    if(isCompleted&&actualOrder){
      html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 8px 12px;">
        <span style="font-size:13px;font-weight:700;color:var(--text);">Your order vs Actual (${comp.rankingConfig?.metricLabel||comp.rankingConfig?.metric||'xG'})</span>
        <span style="font-family:var(--mono);font-size:14px;font-weight:800;color:${correctCount===teams.length?'var(--green)':'var(--accent)'};">${totalPts} pts</span>
      </div>`;
      // Show results comparison
      userOrder.forEach((tid,i)=>{
        const t=teamMap[tid];const actualIdx=actualOrder.indexOf(tid);
        const isCorrect=tid===actualOrder[i];
        const actualT=teamMap[actualOrder[i]];
        html+=rankRowHTML(t, i, {showResult:true, isCorrect, cfg:comp.rankingConfig});
      });
      if(correctCount===teams.length) html+=`<div style="text-align:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--green);padding:8px;">🎯 Perfect ranking! +${comp.rankingConfig?.perfectBonus||5} bonus pts</div>`;
    } else if(isOpen && !(round.deadline && new Date(round.deadline).getTime()<=Date.now())){
            html+=`<div id="ranking-list" data-roundid="${round.id}">`;
      userOrder.forEach((tid,i)=>{
        const t=teamMap[tid];
        html+=rankRowHTML(t, i, {draggable:true, cfg:comp.rankingConfig});
      });
      html+='</div>';
      setTimeout(()=>initDragSort(),50);
      html+=`<button class="submit-preds-btn" onclick="toast('✓ Ranking saved')">Save Ranking</button>`;
    } else {
      html+=`<div style="padding:8px 8px 12px;font-size:12px;color:var(--text-3);font-weight:600;">🔒 Predictions locked</div>`;
      userOrder.forEach((tid,i)=>{
        const t=teamMap[tid];
        html+=`<div style="display:flex;align-items:center;gap:6px;padding:8px;margin-bottom:4px;background:var(--bg);border-radius:8px;border:1px solid var(--border);opacity:0.7;">
          <span style="font-family:var(--mono);font-size:12px;font-weight:800;color:var(--text-3);width:20px;text-align:center;">#${i+1}</span>
          <div class="ev-badge" style="width:24px;height:24px;font-size:7px;">${t.logo?'<img src="'+t.logo+'" alt="'+t.name+'">':t.name.slice(0,3).toUpperCase()}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-family:var(--mono);font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.name}</div>
            <div style="font-size:11px;color:var(--text-2);font-weight:600;">${t.opponent}</div>
          </div>
        </div>`;
      });
    }
    html+='</div>';
    return html;
  }

  // LMS summary bars above events
  if(comp.mode==='lms'&&events.length){
    const total=125;
    const fakeSurvived=[97,78];
    let survived=total;
    events.forEach((ev,i)=>{if(ev.res){survived=fakeSurvived[i]||survived;ev._survivorCount=survived;}});
    const currentSurvived=events.some(e=>e.res)?survived:total;
    const pct=Math.round(currentSurvived/total*100);
    html+=`<div style="padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border);">
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:6px;">
        <div style="display:flex;align-items:center;gap:5px;"><span style="font-family:var(--mono);font-size:20px;font-weight:800;color:var(--text);">${total}</span><span style="font-size:10px;color:var(--text-3);font-weight:600;">JOINED</span></div>
        <div style="display:flex;align-items:center;gap:5px;"><span style="font-family:var(--mono);font-size:20px;font-weight:800;color:${currentSurvived<total?'var(--red)':'var(--green)'};">${events.some(e=>e.res)?currentSurvived:'—'}</span><span style="font-size:10px;color:var(--text-3);font-weight:600;">SURVIVING</span></div>
      </div>
      <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:${pct>60?'var(--green)':pct>30?'var(--amber)':'var(--red)'};border-radius:3px;transition:width 0.4s;"></div></div>
    </div>`;
  }

  // Sort events by kickoff for LMS
  if(comp.mode==='lms') events.sort((a,b)=>(a.sortKey||a.kickoff||'').localeCompare(b.sortKey||b.kickoff||''));

  html+='<div class="events-list">';
  if(!events.length){
    html+='<div class="empty"><div class="empty-icon">📅</div><div class="empty-title">No events yet</div></div>';
  } else {
    let lmsBlocked=false;
    events.forEach((ev,i)=>{
      const isEliminated=eliminatedAtIdx>=0&&i>eliminatedAtIdx;
      const isEliminationPoint=i===eliminatedAtIdx;
      if(comp.mode==='lms'&&isEliminated) lmsBlocked=true;
      const effectiveOpen=comp.mode==='lms'?(isOpen&&!lmsBlocked)
        :comp.mode==='score'?(isOpen&&(ev._scoreLockAt==null||Date.now()<ev._scoreLockAt))
	:comp.mode==='betting'?(isOpen&&(ev._bettingLockAt==null||Date.now()<ev._bettingLockAt))
        :isOpen;
      html+=`<div style="opacity:${isEliminated?'0.4':'1'};">${renderEventCard(ev,comp,effectiveOpen)}</div>`;
    });
  }
  html+='</div>';

  // Progress bar + save button for ALL modes
  if(isOpen&&events.length){
    const openEvents=events.filter(ev=>!ev.res&&!ev.locked);
    const predCount=openEvents.filter(ev=>{const p=preds[ev.id];if(!p)return false;if(comp.mode==='score')return p.h!==undefined&&p.a!==undefined;if(comp.mode==='betting')return typeof p==='object'&&Object.keys(p).length>0;return!!p;}).length;
    if(openEvents.length){
      html+=`<button class="submit-preds-btn${predsDirty?'':' disabled'}" onclick="submitPreds()">${predCount===openEvents.length?'✓ All predictions saved':'Save Predictions ('+predCount+'/'+openEvents.length+')'}</button>`;
    }
  }
  return html;
}

// ── MARGIN PREDICTOR (basketball) ───────────────────────────────────────
// Basketball has no draws and scores are far too high for exact-score
// prediction to be playable, so the natural equivalent is winner plus a
// bucketed winning margin.
const MARGIN_BUCKETS = [
  {key:'m1', label:'1-5'},
  {key:'m2', label:'6-10'},
  {key:'m3', label:'11-20'},
  {key:'m4', label:'20+'},
];
function marginBucket(diff){
  if(diff<=5) return 'm1';
  if(diff<=10) return 'm2';
  if(diff<=20) return 'm3';
  return 'm4';
}
function marginLabel(key){
  const b = MARGIN_BUCKETS.find(x=>x.key===key);
  return b ? b.label : key;
}

// Tennis is player-vs-player, so there's no club crest to show. Nationality
// flags do the same job: instant visual identification. Flag images rather
// than emoji, because Windows browsers render flag emoji as bare letters.

  'Alcaraz':'es','Sinner':'it','Djokovic':'rs','Medvedev':'ru',

  'Tsitsipas':'gr','Rublev':'ru','De Minaur':'au','Shelton':'us',

function teamBadge(logo,name){
  const abbr=(name||'?').split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase();
  const bg=TEAM_COLORS[name]||'oklch(0.55 0.19 275)';
  const style=`background:${bg};`;
  if(logo)return`<div class="ev-badge"><img src="${logo}" alt="${name}" style="width:38px;height:38px;object-fit:contain;" onerror="this.parentElement.setAttribute('style','${style}color:#fff;');this.parentElement.textContent='${abbr}';"></div>`;
  const nat=PLAYER_NAT[name];
  if(nat)return`<div class="ev-badge"><img src="https://flagcdn.com/w40/${nat}.png" alt="${name}" style="width:30px;height:22px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,0.12);" onerror="this.parentElement.setAttribute('style','${style}color:#fff;');this.parentElement.textContent='${abbr}';"></div>`;
  return`<div class="ev-badge">${abbr}</div>`;
}
function scorePoints(pred,res,scoring,unit){
  if(!pred||!res||res.h==null||res.a==null)return[0,''];
  const s=scoring||{exactScore:5,homeGoals:2,awayGoals:2,totalGoals:1};
  const u=unit||'goals'; // 'sets' for tennis, 'goals' for football
  const eH=parseInt(pred.h)==res.h,eA=parseInt(pred.a)==res.a;
  if(eH&&eA)return[s.exactScore,'Exact score correct'];
  if(eH)return[s.homeGoals,'Home '+u+' correct'];
  if(eA)return[s.awayGoals,'Away '+u+' correct'];
  if((parseInt(pred.h)+parseInt(pred.a))==(res.h+res.a))return[s.totalGoals,'Total '+u+' correct'];
  return[0,'No points scored'];
}

function renderEventCard(ev,comp,isRoundOpen){
  const pred=preds[ev.id]??null;
  const hasRes=!!ev.res;
  const isLocked=(()=>{const ko=parseKickoffMs(ev.kickoffRaw||ev.kickoff);return ko!=null?(Date.now()>=ko-30*60*1000):(ev.locked||false);})();
  // Event is "open for input" only if: round is open AND event has no result AND not locked
  const canPredict=isRoundOpen&&!hasRes&&!isLocked;
  const hasPred=comp.mode==='score'?(pred&&pred.h!==undefined&&pred.a!==undefined):comp.mode==='betting'?(pred&&typeof pred==='object'&&Object.keys(pred).length>0):(pred!==null&&pred!==undefined);

  let correct=null,earnedPts=null,pointsBreakdown='',bettingMarketDetails=null;
  if(hasRes&&hasPred){
    if(comp.mode==='lms'){const actual=ev.res.h>ev.res.a?'H':ev.res.h<ev.res.a?'A':'D';correct=pred===actual;}
    else if(comp.mode==='score'){[earnedPts,pointsBreakdown]=scorePoints(pred,ev.res,comp.scoring,comp.scoreUnit);correct=earnedPts>0;}
    else if(comp.mode==='betting'&&typeof pred==='object'){
      earnedPts=0;
      bettingMarketDetails=[];
      (comp.markets||[]).forEach(mkt=>{
        const pick=pred[mkt.type];
        let actualM=null;
        if(mkt.type==='1x2') actualM = ev.res.h>ev.res.a?'H':ev.res.h<ev.res.a?'A':'D';
        else if(mkt.type==='ou25') actualM = (ev.res.h+ev.res.a)>2.5?'O':'U';
        else if(mkt.type==='btts') actualM = (ev.res.h>0&&ev.res.a>0)?'Y':'N';
        else if(mkt.type==='winner') actualM = ev.res.h>ev.res.a?'H':'A'; // no draws in basketball
        else if(mkt.type==='margin') actualM = marginBucket(Math.abs(ev.res.h-ev.res.a));
        const isRight = !!pick && pick===actualM;
        const pts = isRight ? (mkt.points||0) : 0;
        if(isRight) earnedPts+=pts;
        bettingMarketDetails.push({mkt,pick,pts,isRight});
      });
      correct=earnedPts>0;
    }
  }

  let cls='event-card';
  if(canPredict&&hasPred&&comp.mode!=='lms'&&comp.mode!=='score'&&comp.mode!=='betting')cls+=' predicted';
  if(!canPredict)cls+=' locked-pred';

  const hv=(pred&&pred.h!==undefined)?pred.h:'';
  const av=(pred&&pred.a!==undefined)?pred.a:'';

  // Middle section (score inputs, result, or locked pick)
  let midSection;
  if(comp.mode==='score'&&canPredict&&comp.scoreOptions){
    // Fixed set-score outcomes (e.g. best-of-5 tennis) — shown in the
    // prediction area below rather than as free-entry boxes.
    midSection = (hv!==''&&av!=='') ? `<div class="ev-score">${hv}\u2013${av}</div>` : '<div class="ev-vs">vs</div>';
  } else if(comp.mode==='score'&&canPredict){
    midSection=`<div class="score-inline-mid"><input class="score-num-inline${hv!==''?' has':''}" type="number" min="0" max="20" placeholder="0" value="${hv}" id="sh-${ev.id}" oninput="pickScore('${ev.id}','h',this.value)"><span class="score-inline-dash">\u2013</span><input class="score-num-inline${av!==''?' has':''}" type="number" min="0" max="20" placeholder="0" value="${av}" id="sa-${ev.id}" oninput="pickScore('${ev.id}','a',this.value)"></div>`;
  } else if(hasRes){
    midSection=`<div class="ev-score">${ev.res.h}\u2013${ev.res.a}</div>`;
  } else if(comp.mode==='score'&&hasPred&&!hasRes){
    midSection=`<div class="ev-score">${pred.h??'-'}\u2013${pred.a??'-'}</div>`;
  } else {
    midSection='<div class="ev-vs">vs</div>';
  }

  let html=`<div class="${cls}" data-evid="${ev.id}"><div class="event-card-top"><div class="event-meta"><span class="event-league">${ev.tournament||comp.name}</span><span class="event-kickoff">${ev.kickoff||''}</span></div><div class="event-teams"><div style="display:flex;align-items:center;gap:10px;min-width:0;">${teamBadge(ev.homeLogo,ev.home)}<span class="ev-name">${ev.home}</span></div>${midSection}<div style="display:flex;align-items:center;gap:10px;justify-content:flex-end;min-width:0;"><span class="ev-name" style="text-align:right;">${ev.away}</span>${teamBadge(ev.awayLogo,ev.away)}</div></div></div><div class="pred-area">`;

  if(canPredict){
    // Open for prediction
    if(comp.mode==='lms'){
      html+=`<div class="btns-1x2"><button class="btn-1x2${pred==='H'?' selected home':''}" data-val="H" onclick="pick('${ev.id}','H')">Home Win</button><button class="btn-1x2${pred==='D'?' selected draw':''}" data-val="D" onclick="pick('${ev.id}','D')">X</button><button class="btn-1x2${pred==='A'?' selected away':''}" data-val="A" onclick="pick('${ev.id}','A')">Away</button></div>`;
    } else if(comp.mode==='score'&&comp.scoreOptions){
      html+='<div class="btns-1x2" style="flex-wrap:wrap;">'+comp.scoreOptions.map(function(o){
        var sel=(pred&&pred.h===o[0]&&pred.a===o[1])?' selected home':'';
        return '<button class="btn-1x2'+sel+'" style="flex:1 1 30%;min-width:64px;" onclick="pickSetScore(\''+ev.id+'\','+o[0]+','+o[1]+')">'+o[0]+'\u2013'+o[1]+'</button>';
      }).join('')+'</div>';
    } else if(comp.mode==='score'){
      html+='<div style="font-size:11px;color:var(--text-3);text-align:center;padding:2px 0;">Enter scores above \u2191</div>';
    } else if(comp.mode==='betting'){
      const markets=comp.markets||[];const mpred=(pred&&typeof pred==='object')?pred:{};
      html+='<div style="display:flex;flex-direction:column;gap:8px;">';
      markets.forEach(mkt=>{
        html+=`<div><div class="pred-label" style="margin-bottom:5px;font-size:13px;font-weight:600;color:oklch(0.4 0.01 260);">${mkt.label}</div>`;
        const isLocked=(()=>{const ko=parseKickoffMs(ev.kickoffRaw||ev.kickoff);return ko!=null?(Date.now()>=ko-30*60*1000):(ev.locked||false);})();
        const dis=isLocked?'disabled style="pointer-events:none;opacity:0.7;"':'';
        if(mkt.type==='1x2')html+=`<div class="btns-1x2"><button class="btn-1x2${mpred['1x2']==='H'?' selected home':''}" ${isLocked?'disabled':`onclick="pickMarket('${ev.id}','1x2','H')"`}>Home Win</button><button class="btn-1x2${mpred['1x2']==='D'?' selected draw':''}" ${isLocked?'disabled':`onclick="pickMarket('${ev.id}','1x2','D')"`}>X</button><button class="btn-1x2${mpred['1x2']==='A'?' selected away':''}" ${isLocked?'disabled':`onclick="pickMarket('${ev.id}','1x2','A')"`}>Away</button></div>`;
        else if(mkt.type==='ou25')html+=`<div class="btns-ou"><button class="btn-ou over${mpred['ou25']==='O'?' selected':''}" ${isLocked?'disabled':`onclick="pickMarket('${ev.id}','ou25','O')"`}>Over</button><button class="btn-ou under${mpred['ou25']==='U'?' selected':''}" ${isLocked?'disabled':`onclick="pickMarket('${ev.id}','ou25','U')"`}>Under</button></div>`;
        else if(mkt.type==='btts')html+=`<div class="btns-ou"><button class="btn-ou over${mpred['btts']==='Y'?' selected':''}" ${isLocked?'disabled':`onclick="pickMarket('${ev.id}','btts','Y')"`}>Yes</button><button class="btn-ou under${mpred['btts']==='N'?' selected':''}" ${isLocked?'disabled':`onclick="pickMarket('${ev.id}','btts','N')"`}>No</button></div>`;
        else if(mkt.type==='winner')html+=`<div class="btns-ou"><button class="btn-ou over${mpred['winner']==='H'?' selected':''}" ${isLocked?'disabled':`onclick="pickMarket('${ev.id}','winner','H')"`}>${ev.home}</button><button class="btn-ou under${mpred['winner']==='A'?' selected':''}" ${isLocked?'disabled':`onclick="pickMarket('${ev.id}','winner','A')"`}>${ev.away}</button></div>`;
        else if(mkt.type==='margin')html+=`<div class="btns-4">${MARGIN_BUCKETS.map(b=>`<button class="btn-1x2${mpred['margin']===b.key?' selected home':''}" ${isLocked?'disabled':`onclick="pickMarket('${ev.id}','margin','${b.key}')"`}>${b.label}</button>`).join('')}</div>`;
        html+='</div>';
      });
      html+='</div>';
    }
  } else if(hasPred){
    // Locked — show pick and optionally points
    let pl='';
    if(comp.mode==='lms')pl=pred==='H'?ev.home+' (Home)':pred==='D'?'Draw':ev.away+' (Away)';
    else if(comp.mode==='score')pl=(pred.h??'-')+' \u2013 '+(pred.a??'-');
    else if(comp.mode==='betting'&&typeof pred==='object')pl=Object.entries(pred).map(([k,v])=>k.toUpperCase()+': '+v).join(' \u00b7 ');

    if(hasRes&&comp.mode==='score'&&earnedPts!=null){
      html+=`<div class="pred-result-row"><div class="pred-made">Your pick: <strong>${pl}</strong></div><span class="pred-correct ${earnedPts>0?'yes':'no'}">${earnedPts>0?'+'+earnedPts+' pts':'\u2717 0 pts'}</span></div>`;
      if(pointsBreakdown)html+=`<div style="font-size:12px;color:${earnedPts>0?'var(--green)':'var(--text-3)'};margin-top:4px;font-weight:600;">${pointsBreakdown}</div>`;
    } else if(hasRes&&comp.mode==='betting'&&bettingMarketDetails){
      html+='<div style="display:flex;flex-direction:column;gap:8px;">';
      bettingMarketDetails.forEach(({mkt,pick,pts,isRight})=>{
        html+=`<div><div style="margin-bottom:5px;font-size:13px;font-weight:600;color:oklch(0.4 0.01 260);display:flex;justify-content:space-between;align-items:center;">
          <span>${mkt.label}</span>
          <span class="pred-correct ${isRight?'yes':'no'}">+${pts} pts</span>
        </div>`;
        if(mkt.type==='1x2')html+=`<div class="btns-1x2"><button class="btn-1x2${pick==='H'?' selected home':''}" disabled>Home Win</button><button class="btn-1x2${pick==='D'?' selected draw':''}" disabled>X</button><button class="btn-1x2${pick==='A'?' selected away':''}" disabled>Away</button></div>`;

        html+='</div>';
      });
      html+=`<div style="display:flex;justify-content:flex-end;padding-top:8px;border-top:1px solid oklch(0.92 0.004 260);"><span class="pred-correct ${earnedPts>0?'yes':'no'}">Total: ${earnedPts>0?'+':''}${earnedPts} pts</span></div>`;
      html+='</div>';
    } else if(hasRes&&correct!=null){
      html+=`<div class="pred-result-row"><div class="pred-made">Your pick: <strong>${pl}</strong></div><span class="pred-correct ${correct?'yes':'no'}">${correct?'\u2713 Correct':'\u2717 Wrong'}</span></div>`;
      if(comp.mode==='lms'&&ev._survivorCount!==undefined){

      }
    } else {
      if(comp.mode==='betting'&&typeof pred==='object'){
        var mpred2=pred;
        html+='<div style="display:flex;flex-direction:column;gap:8px;">';
        (comp.markets||[]).forEach(function(mkt){
          html+='<div><div style="margin-bottom:5px;font-size:13px;font-weight:600;color:oklch(0.4 0.01 260);">'+mkt.label+'</div>';
          var h=mpred2['1x2'],o=mpred2['ou25'],b=mpred2['btts'];
          if(mkt.type==='1x2')html+='<div class="btns-1x2">'
            +'<button class="btn-1x2'+(h==='H'?' selected home':'')+'" disabled>Home Win</button>'
            +'<button class="btn-1x2'+(h==='D'?' selected draw':'')+'" disabled>X</button>'
            +'<button class="btn-1x2'+(h==='A'?' selected away':'')+'" disabled>Away</button>'
            +'</div>';
          else if(mkt.type==='ou25')html+='<div class="btns-ou">'
            +'<button class="btn-ou over'+(o==='O'?' selected':'')+'" disabled>Over</button>'
            +'<button class="btn-ou under'+(o==='U'?' selected':'')+'" disabled>Under</button>'
            +'</div>';
          else if(mkt.type==='btts')html+='<div class="btns-ou">'
            +'<button class="btn-ou over'+(b==='Y'?' selected':'')+'" disabled>Yes</button>'
            +'<button class="btn-ou under'+(b==='N'?' selected':'')+'" disabled>No</button>'
            +'</div>';
          else if(mkt.type==='winner')html+='<div class="btns-ou">'
            +'<button class="btn-ou over'+(mpred2['winner']==='H'?' selected':'')+'" disabled>'+ev.home+'</button>'
            +'<button class="btn-ou under'+(mpred2['winner']==='A'?' selected':'')+'" disabled>'+ev.away+'</button>'
            +'</div>';
          else if(mkt.type==='margin')html+='<div class="btns-4">'
            +MARGIN_BUCKETS.map(function(bk){return '<button class="btn-1x2'+(mpred2['margin']===bk.key?' selected home':'')+'" disabled>'+bk.label+'</button>';}).join('')
            +'</div>';
          html+='</div>';
        });
        html+='<div style="font-size:11px;color:oklch(0.58 0.01 260);margin-top:4px;">⏳ Awaiting result</div>';
        html+='</div>';
      } else {
        html+=`<div><div class="pred-made">Your pick: <strong>${pl}</strong></div><div style="margin-top:4px;"><span style="font-size:11px;color:var(--amber);font-weight:600;">⏳ Awaiting result</span></div></div>`;
      }
    }

    html+='<div style="font-size:12px;color:var(--text-3);">No prediction made.</div>';

    }
  }
  html+='</div></div>';return html;
}

// ── COUNTDOWN ──────────────────────────────────────────────────────────────
let countdownInterval;
function startCountdown(deadline,onExpire){
  clearInterval(countdownInterval);
  function update(){
    const el=document.getElementById('countdown-text');if(!el)return;
    const diff=new Date(deadline)-Date.now();
    if(diff<=0){
      clearInterval(countdownInterval);
      if(typeof onExpire==='function'){onExpire();return;}
      el.textContent='Predictions locked';
      return;
    }
    const d=Math.floor(diff/86400000),h=Math.floor((diff%86400000)/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
    let txt='';
    if(d>0)txt=`${d}d ${h}h ${m}m`;
    else if(h>0)txt=`${h}h ${m}m ${s}s`;
    else txt=`${m}m ${s}s`;
    el.innerHTML=txt;
  }
  update();
  countdownInterval=setInterval(update,1000);
}

// ── PICKS ─────────────────────────────────────────────────────────────────
function pick(id,val){
  preds[id]=val;predsDirty=true;
  renderPredict();
}
function updateSubmitBtnText(){
  const comp=COMPS[currentCompIdx]; if(!comp) return;
  const round=comp.rounds[selectedRound[currentCompIdx]]; if(!round) return;
  const events=(round.eventIds||[]).map(id=>({id,...EVENTS[id]})).filter(e=>e.home);
  const openEvents=events.filter(ev=>!ev.res&&!ev.locked);
  if(!openEvents.length) return;
  const predCount=openEvents.filter(ev=>{const p=preds[ev.id];if(!p)return false;if(comp.mode==='score')return p.h!==undefined&&p.a!==undefined;if(comp.mode==='betting')return typeof p==='object'&&Object.keys(p).length>0;return!!p;}).length;
  const btn=document.querySelector('.submit-preds-btn');
  if(btn) btn.textContent = predCount===openEvents.length?'✓ All predictions saved':'Save Predictions ('+predCount+'/'+openEvents.length+')';
}
// Fixed set-score pick (tennis). Writes the same {h,a} shape as pickScore
// so scoring, the leaderboard and the save flow all work unchanged.
function pickSetScore(id,h,a){
  predsDirty=true;
  preds[id]={h:h,a:a};
  renderPredict();
}

function pickScore(id,side,val){
  predsDirty=true;
  if(!preds[id]||typeof preds[id]!=='object')preds[id]={};
  preds[id][side]=val===''?undefined:parseInt(val);
  const input=document.getElementById((side==='h'?'sh-':'sa-')+id);
  if(input)input.classList.toggle('has',val!=='');
  // Activate submit button + refresh live count
  const btn=document.querySelector('.submit-preds-btn');
  if(btn&&predsDirty){btn.classList.remove('disabled');}
  updateSubmitBtnText();
}
function pickMarket(evId,market,val){
  predsDirty=true;
  if(!preds[evId]||typeof preds[evId]!=='object')preds[evId]={};
  if(preds[evId][market]===val){
    delete preds[evId][market];
  } else {
    preds[evId][market]=val;
  }
  renderPredict();
}
function changeRound(idx){selectedRound[currentCompIdx]=parseInt(idx);renderPredict();}
function moveRank(roundId,teamId,dir){
  const key=roundId+'_ranking';
  const order=preds[key];if(!order)return;
  const idx=order.indexOf(teamId);if(idx<0)return;
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=order.length)return;
  [order[idx],order[newIdx]]=[order[newIdx],order[idx]];
  renderPredict();
}

// Ranking metric helpers. Legacy rounds carry actualXG; newer ones use the
// neutral actualValue, so both are supported.
function rankVal(t){ return t.actualValue!=null ? t.actualValue : t.actualXG; }
function rankFmt(v, cfg){
  if(v==null) return '\u2014';
  const d = cfg && cfg.decimals!=null ? cfg.decimals : 1;
  return d===0 ? String(Math.round(v)) : v.toFixed(d);
}
function rankUnit(cfg){ return (cfg && cfg.metric) ? cfg.metric : 'xG'; }

function renumberRankItems(list){
  // Numbers reflect whichever slot a row currently sits in — recomputed fresh
  // from DOM order, never carried along with a team as it moves.
  list.querySelectorAll('.rank-item').forEach((el,i)=>{
    el.querySelectorAll('.rank-num').forEach(num=>{ num.textContent=(i+1); });
  });
}

function initDragSort(){
  const list=document.getElementById('ranking-list');
  if(!list)return;
  const roundId=list.dataset.roundid;
  let dragItem=null, itemH=0;
  // The row currently highlighted as the drop target, and whether the
  // dragged item would land before or after it. Nothing actually moves
  // until the user releases — dragging only highlights a candidate slot.
  // dropTarget is "sticky": once set it only changes when another row
  // clearly overlaps more, so release always has something valid to commit.
  let dropTarget=null;
  const OVERLAP_THRESHOLD=0.15; // don't switch target until ~15% covered

  function clearHighlights(){
    list.querySelectorAll('.rank-item.drag-over').forEach(el=>el.classList.remove('drag-over'));
  }

  function commitReorder(){
    // A genuine swap of the two rows' positions — whatever is highlighted
    // when the user releases always actually changes places with the
    // dragged row, regardless of exactly where in that row they let go.
    if(dragItem && dropTarget && dropTarget!==dragItem){
      const dragNext=dragItem.nextSibling;
      const dropNext=dropTarget.nextSibling;
      if(dragNext===dropTarget){
        list.insertBefore(dropTarget,dragItem);
      } else if(dropNext===dragItem){
        list.insertBefore(dragItem,dropTarget);
      } else {
        const marker=document.createComment('');
        list.insertBefore(marker,dragItem);
        list.insertBefore(dragItem,dropNext);
        list.insertBefore(dropTarget,marker);
        marker.remove();
      }
    }
    clearHighlights();
    renumberRankItems(list);
    const newOrder=[...list.querySelectorAll('.rank-item')].map(el=>el.dataset.tid);
    preds[roundId+'_ranking']=newOrder;
    predsDirty=true;
    const btn=document.querySelector('.submit-preds-btn');
    if(btn){btn.classList.remove('disabled');}
    dropTarget=null;
  }

  // Picks whichever row has the greatest overlap with a virtual box the same
  // height as the dragged row, centered on the pointer. Only switches to a
  // new target once overlap clears the threshold, and never un-highlights
  // to nothing — the last valid target stays sticky until a better one wins.
  function updateDropTarget(clientY){
    const items=[...list.querySelectorAll('.rank-item')];
    const others=items.filter(it=>it!==dragItem);
    if(!others.length)return;
    const h=itemH||others[0].getBoundingClientRect().height;
    const dragTop=clientY-h/2, dragBottom=clientY+h/2;

    let best=null, bestPct=0;
    others.forEach(it=>{
      const rect=it.getBoundingClientRect();
      const overlapTop=Math.max(dragTop,rect.top);
      const overlapBottom=Math.min(dragBottom,rect.bottom);
      const overlapH=Math.max(0,overlapBottom-overlapTop);
      const pct=rect.height>0?overlapH/rect.height:0;
      if(pct>bestPct){ bestPct=pct; best=it; }
    });

    if(best && bestPct>=OVERLAP_THRESHOLD){
      dropTarget=best;
    }
    // else: below threshold everywhere — keep the previous dropTarget as-is

    clearHighlights();
    if(dropTarget) dropTarget.classList.add('drag-over');
  }

  list.querySelectorAll('.rank-item').forEach(item=>{
    // Touch events — drag can start anywhere on the row, but only activates
    // after a brief hold with minimal movement. A normal scroll swipe moves
    // quickly right away and cancels the pending drag instead of hijacking it.
    let holdTimer=null, touchStartX=0, touchStartY=0, holdCancelled=false;
    const HOLD_MS=160, MOVE_TOLERANCE=10;
    item.addEventListener('touchstart',e=>{
      const touch=e.touches[0];
      touchStartX=touch.clientX; touchStartY=touch.clientY;
      holdCancelled=false;
      clearTimeout(holdTimer);
      holdTimer=setTimeout(()=>{
        if(holdCancelled)return;
        dragItem=item;
        itemH=item.offsetHeight;
        dropTarget=null;
        item.classList.add('dragging');
        item.style.zIndex='100';
      },HOLD_MS);
    },{passive:true});
    item.addEventListener('touchmove',e=>{
      if(dragItem===item)return; // already active — list-level handler takes over
      const touch=e.touches[0];
      const dx=Math.abs(touch.clientX-touchStartX), dy=Math.abs(touch.clientY-touchStartY);
      if(dx>MOVE_TOLERANCE||dy>MOVE_TOLERANCE){
        holdCancelled=true;
        clearTimeout(holdTimer);
      }
    },{passive:true});
    item.addEventListener('touchend',()=>{
      holdCancelled=true;
      clearTimeout(holdTimer);
    },{passive:true});

    // Mouse drag
    item.addEventListener('dragstart',e=>{
      dragItem=item;
      itemH=item.offsetHeight;
      dropTarget=null;
      e.dataTransfer.effectAllowed='move';
      setTimeout(()=>item.classList.add('dragging'),0);
    });
    item.addEventListener('dragend',()=>{
      if(dragItem){dragItem.classList.remove('dragging');}
      commitReorder();
      dragItem=null;
    });
    item.addEventListener('dragover',e=>{
      e.preventDefault();
      if(!dragItem)return;
      updateDropTarget(e.clientY);
    });
  });

  // Touch move/end on list — highlight only, no live reordering
  list.addEventListener('touchmove',e=>{
    if(!dragItem)return;
    e.preventDefault();
    updateDropTarget(e.touches[0].clientY);
  },{passive:false});

  list.addEventListener('touchend',()=>{
    if(!dragItem)return;
    dragItem.classList.remove('dragging');
    dragItem.style.zIndex='';
    commitReorder();
    dragItem=null;
  });

  list.addEventListener('drop',e=>{
    e.preventDefault();
    if(dragItem){dragItem.classList.remove('dragging');}
    commitReorder();
    dragItem=null;
  });
}

  if(rlExpandedEventId){
    rlLoadState(rlExpandedEventId);
    setTimeout(()=>initRouletteBoard(),50);
  }
}

function rlSaveCurrentState(){
  if(rlExpandedEventId) RL_STATE[rlExpandedEventId]={remaining:rlRemaining, stakes:{...rlStakes}};
}
function rlLoadState(eventId){
  const saved=RL_STATE[eventId];
  rlRemaining = saved ? saved.remaining : RL_BUDGET;
  rlStakes = saved ? {...saved.stakes} : {};
}

function initRouletteBoard(){
  rlMeta={};
  const gridEl=document.getElementById('rl-grid');
  if(!gridEl)return;
  gridEl.innerHTML='';

  for(let r=0;r<4;r++){
    for(let c=0;c<4;c++){
      const id=rlCellId(r,c);
      const type=rlCellType(RL_HOME[r],RL_AWAY[c]);
      const bg=type==='draw'?'var(--surface)':type==='home'?'var(--accent-light)':'#FFEDD5';
      const div=document.createElement('div');
      div.id=id; div.dataset.h=RL_HOME[r]; div.dataset.a=RL_AWAY[c]; div.dataset.baseBg=bg;
      div.style.cssText=`position:relative;border-radius:12px;border:1px solid var(--border);background:${bg};display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:transform .1s,outline .15s,box-shadow .15s;`;
      div.onclick=()=>rlAddChip(id);
      div.innerHTML=`<span id="rlminus_${id}" onclick="event.stopPropagation();rlRemoveChip('${id}')" style="position:absolute;top:-7px;right:-7px;width:19px;height:19px;border-radius:50%;background:var(--red);color:white;font-size:12px;font-weight:700;display:none;align-items:center;justify-content:center;cursor:pointer;line-height:1;z-index:6;">−</span>
        <span style="font-family:var(--mono);font-size:16px;font-weight:700;color:var(--text);">${rlScoreLabel(r,c)}</span>
        <span id="rlchip_${id}" style="display:none;margin-top:5px;font-family:var(--mono);font-size:12px;font-weight:700;color:white;background:var(--accent);border-radius:8px;padding:2px 9px;min-width:24px;text-align:center;"></span>`;
      gridEl.appendChild(div);
      rlMeta[id]={label:rlScoreLabel(r,c)+' correct score',mult:16,type:'SCORE'};
    }
  }
  rlMeta['rlbtts_Y']={label:'Both teams to score: Yes',mult:2,type:'MARKET'};
  rlMeta['rlbtts_N']={label:'Both teams to score: No',mult:2,type:'MARKET'};
  rlMeta['rlou_O']={label:'Over 2.5 goals',mult:2,type:'MARKET'};
  rlMeta['rlou_U']={label:'Under 2.5 goals',mult:2,type:'MARKET'};

  Object.keys(rlMeta).forEach(rlRender);
  rlUpdateFooter();
  rlFitBoard();
}

function rlFitBoard(){
  const outer=document.getElementById('rl-scale-outer');
  const inner=document.getElementById('rl-scale-inner');
  if(!outer||!inner)return;
  inner.style.transform='none';
  const naturalW=inner.offsetWidth;
  const naturalH=inner.offsetHeight;
  const availW=outer.clientWidth;
  const scale=Math.min(1, availW/naturalW);
  inner.style.transform=`scale(${scale})`;
  outer.style.height=(naturalH*scale)+'px';
}
window.addEventListener('resize',()=>{ if(document.getElementById('rl-scale-outer'))rlFitBoard(); });

function rlAddChip(id){
  if(rlRemaining<RL_STEP)return;
  rlStakes[id]=(rlStakes[id]||0)+RL_STEP;
  rlRemaining-=RL_STEP;
  rlRender(id);
  rlHighlightGrid();
}
function rlRemoveChip(id){
  if(!rlStakes[id])return;
  rlStakes[id]-=RL_STEP;
  rlRemaining+=RL_STEP;
  if(rlStakes[id]<=0)delete rlStakes[id];
  rlRender(id);
  rlHighlightGrid();
}
function rlClearAll(){
  Object.keys(rlStakes).forEach(k=>delete rlStakes[k]);
  rlRemaining=RL_BUDGET;
  Object.keys(rlMeta).forEach(rlRender);
  rlHighlightGrid();
}
function rlRender(id){
  const el=document.getElementById(id);
  const chipEl=document.getElementById('rlchip_'+id);
  const minusEl=document.getElementById('rlminus_'+id);
  const val=rlStakes[id]||0;
  const isMarket = id.startsWith('rlbtts_')||id.startsWith('rlou_');
  if(chipEl){
    chipEl.textContent=val;
    chipEl.style.display=val>0?(isMarket?'block':'inline-block'):'none';
  }
  if(minusEl){minusEl.style.display=val>0?'flex':'none';}
  rlUpdateFooter();
}
// Which score cells match a given special market ("both teams to score" / "over-under")
function rlMatchesMarket(marketId, h, a){
  const total=h+a;
  if(marketId==='rlbtts_Y') return h>0 && a>0;
  if(marketId==='rlbtts_N') return h===0 || a===0;
  if(marketId==='rlou_O') return total>2.5;
  if(marketId==='rlou_U') return total<=2.5;
  return false;
}

function rlPreviewHighlight(marketId){
  rlApplyGridHighlight([marketId]);
}
// Persistent highlight — reflects whatever markets are actually staked right now
function rlHighlightGrid(){
  const active=['rlbtts_Y','rlbtts_N','rlou_O','rlou_U'].filter(id=>(rlStakes[id]||0)>0);
  rlApplyGridHighlight(active);
}

// ── LINEUP LEADERBOARD: points-history popup (demo) ─────────────────────────
// Same idea as demoScoreBreakdown/demoBettingBreakdown: reverse-engineer a
// plausible set of picks from the target correct/bonusCorrect counts,
// deterministically seeded per user so it's stable across renders.
let lineupLbCache=null;
function demoLineupBreakdown(round, correctTarget, bonusCorrectTarget, seed){
  const rng = demoRng(seed);
  const actual = LIV_ACTUAL_XI[round.id] || [];
  const allSquad = [...LIV_SQUAD.GK,...LIV_SQUAD.DEF,...LIV_SQUAD.MID,...LIV_SQUAD.FWD];
  const allIds = allSquad.map(p=>p.id);
  const notActual = allIds.filter(id=>!actual.includes(id));
  const shuffledActual = [...actual].sort(()=>rng()-0.5);
  const shuffledOther = [...notActual].sort(()=>rng()-0.5);
  const picks = [...shuffledActual.slice(0, Math.min(correctTarget, actual.length)), ...shuffledOther].slice(0,11);

  const bonusAns = LIV_BONUS_ANSWERS[round.id] || {firstGoal:null, mvp:null, firstSubOut:null};
  const bonusKeys = ['firstGoal','mvp','firstSubOut'];
  const shuffledKeys = [...bonusKeys].sort(()=>rng()-0.5);
  const bonus = {};
  shuffledKeys.forEach((k,i)=>{
    if(i<bonusCorrectTarget && bonusAns[k]){ bonus[k]=bonusAns[k]; return; }
    const wrongPool = allIds.filter(id=>id!==bonusAns[k]);
    bonus[k]=wrongPool[Math.floor(rng()*wrongPool.length)];
  });
  return {picks, bonus};
}

let sqaState = { gw:12, level:'consistency', metricKey:'started', minPct:50, detail:null };

const SQA_NAMES = ['Rivera','Silva','Okafor','Bennett','Novak','Haaland','Costa','Mbappe','Kane','Foden','Rice','Saka','Martz','Nunes','Palmer','Odegaard','Wan','Alvarez','Gakpo','Diaz','Jota','Konate','Bradley','Elliott'];

const SQA_ZODIAC = ['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];

  { group:'demographics', key:'zodiac',   short:'Zodiac',        label:'Most popular zodiac', type:'cat',    lowerBetter:false, caption:'The most common star sign in the squad, with how many players share it.' },

const SQA_CLUBS_RAW = [
  ['Arsenal', '#c8102e', 18, 9, 82], ['Aston Villa', '#7a003c', 21, 12, 68],
  ['Bournemouth', '#d31b2b', 23, 13, 60], ['Brentford', '#d20000', 20, 10, 74],

function sqaMode(arr){ const m={}; let best=arr[0], bc=0; arr.forEach(v=>{ m[v]=(m[v]||0)+1; if(m[v]>bc){bc=m[v];best=v;} }); return {value:best,count:bc}; }

let _sqaClubs = null;
function sqaClubs(){
  if(_sqaClubs) return _sqaClubs;
  _sqaClubs = SQA_CLUBS_RAW.map((a,idx)=>{
    const [name,color,started,lineups,seed] = a;
    const conc = seed/100, shape=[];
    for(let i=0;i<10;i++){
      const fringe = Math.exp(-Math.pow(i-0.5,2)/3) * (1-conc+0.3);
      const core = Math.exp(-Math.pow(i-9,2)/(2+(1-conc)*8)) * (conc+0.4);
      shape.push(fringe+core);
    }
    const sum = shape.reduce((x,y)=>x+y,0);
    const dist=[]; let assigned=0;
    for(let i=0;i<10;i++){ const v=Math.round(shape[i]/sum*25); dist.push(v); assigned+=v; }
    dist[9] += (25-assigned); if(dist[9]<0) dist[9]=0;

    const roster=[];
    dist.forEach((cnt,bi)=>{
      for(let k=0;k<cnt;k++){
        const j = roster.length;
        const step = 10/(cnt+1);
        // Vary how many distinct signs each club's roster is drawn from (5-12)
        // so the "most common zodiac" headcount differs club to club instead
        // of every club converging on the same ~25/12 \u2248 3 average.
        const zBuckets = 5 + (idx % 8);
        roster.push({
          name: SQA_NAMES[j % SQA_NAMES.length],
          pct: Math.min(100, Math.round(bi*10 + 10 - step*(k+1))),
          nat: SQA_NATIONS[(idx*3 + j*5) % SQA_NATIONS.length],
          age: 21 + ((idx*2 + j*3) % 9),
          zodiac: SQA_ZODIAC[(idx + j) % zBuckets], // step of 1 (not 5) avoids collisions with zBuckets divisors
        });
      }
    });
    roster.sort((x,y)=>y.pct-x.pct);

    const nations = new Set(roster.map(r=>r.nat)).size;
    const topNat = sqaMode(roster.map(r=>r.nat));
    const zodiac = sqaMode(roster.map(r=>r.zodiac));
    const avgAge = roster.reduce((s,r)=>s+r.age,0)/roster.length;
    const avgChange = Math.min(6, Math.max(1.4, 1.4 + (lineups-8)*0.34));

    return {name,color,started,lineups,dist,roster,nations,topNat,zodiac,avgAge,avgChange};
  });
  return _sqaClubs;
}

function sqaThBand(){ return Math.min(9, Math.round(sqaState.minPct/10)); }

function sqaMetricVal(c, def){
  switch(def.key){
    case 'started': return {value:c.started, sort:c.started};
    case 'lineups': return {value:c.lineups, sort:c.lineups};
    case 'avgChange': return {value:c.avgChange.toFixed(1), sort:c.avgChange};
    case 'nations': return {value:c.nations, sort:c.nations};
    case 'avgAge': return {value:c.avgAge.toFixed(1), sort:c.avgAge};
    case 'topNat': return {value:c.topNat.value+' · '+c.topNat.count, sort:c.topNat.count};
    case 'zodiac': return {value:c.zodiac.value+' · '+c.zodiac.count, sort:c.zodiac.count};
    case 'minutes': {
      const th = sqaThBand();
      const n = c.dist.reduce((s,v,i)=> s + (i>=th?v:0), 0);
      return {value:n, sort:n};
    }
  }
}

function sqaTag(text,tone){

}

function sqaBuildDetail(){
  const name = sqaState.detail;
  if(!name) return null;
  const club = sqaClubs().find(c=>c.name===name);
  const def = SQA_DEFS.find(m=>m.key===sqaState.metricKey);
  let items=[], sub='';

  if(def.key==='minutes'){
    const th = sqaState.minPct;
    const list = club.roster.filter(p=>p.pct >= (th===100?96:th));
    sub = list.length+' player'+(list.length===1?'':'s')+' \u2265 '+th+'% of minutes';
    items = list.map((p,i)=>({idx:i+1, primary:p.name, secondary:'Appeared in ~'+Math.round(p.pct/100*12)+' of 12 matchdays', tag:sqaTag(p.pct+'%', p.pct>=90?'g':'p')}));
  } else if(def.key==='started'){
    sub = club.started+' distinct players started';
    items = club.roster.slice(0,club.started).map((p,i)=>{ const starts=Math.max(1,Math.round(p.pct/100*12)); return {idx:i+1, primary:p.name, secondary:p.nat+' · age '+p.age, tag:sqaTag(starts+' starts', starts>=8?'g':'n')}; });
  } else if(def.key==='lineups'){
    sub = club.lineups+' distinct starting XIs';
    const namesPool = club.roster.map(p=>p.name);
    items = Array.from({length:club.lineups},(_,i)=>{
      const uses=i===0?Math.max(1,12-(club.lineups-1)):1;
      // Deterministic rotation of the roster per lineup group so each one
      // lists a different, stable set of 11 names as plain text.
      const rot = (i*3) % namesPool.length;
      const eleven = namesPool.slice(rot).concat(namesPool.slice(0,rot)).slice(0,11).join(', ');
      return {idx:i+1, primary:eleven, secondary:'Used '+uses+'\u00d7 \u00b7 First used GW '+Math.min(12,i+1), tag:sqaTag(uses+'\u00d7', i===0?'g':'n'), wrap:true};
    });
  } else if(def.key==='avgChange'){
    sub = 'Avg '+club.avgChange.toFixed(1)+' starters changed between games';
    items = Array.from({length:11},(_,i)=>{ const ch=Math.max(0,Math.round(club.avgChange+Math.sin(i*1.7)*1.6)); return {idx:i+1, primary:'GW '+(i+1)+' \u2192 '+(i+2), secondary:ch+' starter'+(ch===1?'':'s')+' swapped', tag:sqaTag(ch+' changes', ch<=club.avgChange?'g':'n')}; });
  } else if(def.key==='nations' || def.key==='topNat'){
    const counts={}; club.roster.forEach(p=>counts[p.nat]=(counts[p.nat]||0)+1);
    const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    sub = def.key==='topNat' ? (club.topNat.value+' leads with '+club.topNat.count+' players') : (club.nations+' nationalities represented');
    items = sorted.map(([nat,cnt],i)=>({idx:i+1, primary:nat, secondary:club.roster.filter(p=>p.nat===nat).slice(0,3).map(p=>p.name).join(', '), tag:sqaTag(cnt+' player'+(cnt===1?'':'s'), i===0?'p':'n')}));
  } else if(def.key==='avgAge'){
    sub = 'Average age '+club.avgAge.toFixed(1)+' years';
    const byAge = [...club.roster].sort((a,b)=>b.age-a.age);
    items = byAge.map((p,i)=>({idx:i+1, primary:p.name, secondary:p.nat, tag:sqaTag(p.age+' yrs', p.age>=30?'n':(p.age<=22?'g':'p'))}));
  } else if(def.key==='zodiac'){
    const counts={}; club.roster.forEach(p=>counts[p.zodiac]=(counts[p.zodiac]||0)+1);
    const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    sub = club.zodiac.value+' is most common ('+club.zodiac.count+' players)';
    items = sorted.map(([sign,cnt],i)=>({idx:i+1, primary:sign, secondary:club.roster.filter(p=>p.zodiac===sign).slice(0,3).map(p=>p.name).join(', '), tag:sqaTag(cnt+' player'+(cnt===1?'':'s'), i===0?'p':'n')}));
  }

  return { club, def, sub, items };
}

function sqaSelectLevel(key){
  const first = SQA_DEFS.find(d=>d.group===key);
  sqaState = {...sqaState, level:key, metricKey:first.key};
  renderPredict();
}
function sqaSelectMetric(key){
  sqaState = {...sqaState, metricKey:key};
  renderPredict();
}
function sqaSetThreshold(val){
  sqaState = {...sqaState, minPct:parseInt(val,10)};
  renderPredict();
}
function sqaOpenDetail(name){
  sqaState = {...sqaState, detail:name};
  renderPredict();
}
function sqaCloseDetail(){
  sqaState = {...sqaState, detail:null};
  renderPredict();
}

let tsState = { gw:12, level:'score', goalType:'all', minLo:0, minHi:90, posLo:1, posHi:20 };

const TS_PLAYERS = [
  ['Haaland','Man City','#6cabdd'], ['Salah','Liverpool','#c8102e'],
  ['Isak','Newcastle','#241f20'], ['Saka','Arsenal','#c8102e'],
  ['Solanke','Tottenham','#132257'], ['Palmer','Chelsea','#034694'],
  ['Watkins','Aston Villa','#7a003c'], ['Mbeumo','Brentford','#d20000'],
  ['Wood','Nott\u2019m Forest','#c8102e'], ['Cunha','Wolves','#fdb913'],
  ['Mateta','Crystal Palace','#1b458f'], ['Bowen','West Ham','#7a263a'],
];
const TS_TYPES = [
  { key:'all',        label:'All goal types' },
  { key:'leading',    label:'Leading goal' },
  { key:'equalising', label:'Equalising goal' },
  { key:'reducing',   label:'Reducing difference' },
  { key:'increasing', label:'Increasing difference' },
];

let _tsGoals = null;
function tsGoals(){
  if(_tsGoals) return _tsGoals;
  const types = TS_TYPES.filter(t=>t.key!=='all').map(t=>t.key);
  _tsGoals = TS_PLAYERS.map(([name,club,color],pi)=>{
    const count = 17 - pi; // Haaland 17 ... down to 6
    const events = [];
    for(let i=0;i<count;i++){
      const h = (pi*37 + i*53) % 95;
      events.push({ minute: 1+h, type: types[(pi*3+i*7)%4], oppPos: 1+((pi*5+i*11)%20) });
    }
    return {name,club,color,events};
  });
  return _tsGoals;
}
function tsSuffix(n){
  if(n%10===1 && n!==11) return 'st';
  if(n%10===2 && n!==12) return 'nd';
  if(n%10===3 && n!==13) return 'rd';
  return 'th';
}
function tsFill(a,b){
  return `position:absolute;top:10px;height:6px;border-radius:3px;left:${a}%;width:${Math.max(0,b-a)}%;background:linear-gradient(90deg,#8a6bf0,#6d4be0);`;
}
function tsHeatCell(v,min,max){
  const t = max===min ? 0.6 : (v-min)/(max-min);
  const alpha = 0.12 + t*0.78;
  const color = t>0.55 ? '#fff' : '#4a3aa0';
  return `min-width:46px;text-align:center;padding:6px 12px;border-radius:8px;font-size:14px;font-weight:800;background:rgba(109,75,224,${alpha.toFixed(2)});color:${color};`;
}
function tsChip(on){
  return `border:1px solid ${on?'#6d4be0':'#e6e7ee'};background:${on?'#efeaff':'#fff'};color:${on?'#6d4be0':'#8a8b98'};border-radius:7px;padding:5px 10px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;`;
}

// ── LEADERBOARD POINTS BREAKDOWN POPUP (demo) ────────────────────────────────
// Demo leaderboard data is static, so per-user predictions are generated
// deterministically (seeded by username+round) to decompose each user's
// points into a plausible event-by-event breakdown.
// Ranking: decompose a score into which items the user placed correctly.
// pointsPerCorrect each, plus the perfect bonus when everything lines up.
function demoRankingBreakdown(comp, round, uname, target){
  const items = round.rankingTeams || [];
  const cfg = comp.rankingConfig || {};
  const per = cfg.pointsPerCorrect || 2, bonus = cfg.perfectBonus || 5;
  const actual = [...items].sort((a,b)=>(rankVal(b)||0)-(rankVal(a)||0));
  const perfect = actual.length*per + bonus;
  let nCorrect = target>=perfect ? actual.length : Math.max(0, Math.min(actual.length, Math.floor(target/per)));
  const rng = demoRng(demoHash(uname+'|'+round.id+'|rank'));
  // Which positions they got right — deterministic, but not always the top ones.
  const idxs = actual.map((_,i)=>i).sort(()=>rng()-0.5).slice(0, nCorrect);
  const correctSet = new Set(idxs);
  const events = actual.map((t,i)=>({
    home:t.name, away:t.opponentName||'', roundLabel:round.label,
    actualPos:i+1, userPos: correctSet.has(i) ? i+1 : null,
    value: rankVal(t), unit: rankUnit(cfg),
    evPts: correctSet.has(i) ? per : 0,
  }));
  let pts = nCorrect*per + (nCorrect===actual.length ? bonus : 0);
  return {pts, events, perfect: nCorrect===actual.length, bonus};
}

// Match ups: which head-to-heads the user called correctly.
function demoMatchupBreakdown(comp, round, uname, target){
  const mus = (round.matchups||[]).filter(m=>m.a.pts!=null && m.b.pts!=null);
  const cfg = comp.matchupConfig || {};
  const per = cfg.pointsPerCorrect || 2, bonus = cfg.perfectBonus || 6;
  const perfect = mus.length*per + bonus;
  let nCorrect = target>=perfect ? mus.length : Math.max(0, Math.min(mus.length, Math.floor(target/per)));
  const rng = demoRng(demoHash(uname+'|'+round.id+'|mu'));
  const idxs = mus.map((_,i)=>i).sort(()=>rng()-0.5).slice(0, nCorrect);
  const correctSet = new Set(idxs);
  const events = mus.map((m,i)=>{
    const winner = m.a.pts>=m.b.pts ? m.a : m.b;
    const loser  = m.a.pts>=m.b.pts ? m.b : m.a;
    const right  = correctSet.has(i);
    return {
      home:m.a.name, away:m.b.name, roundLabel:round.label,
      pickName: right ? winner.name : loser.name,
      winnerName: winner.name,
      aName:m.a.name, aPts:m.a.pts, bName:m.b.name, bPts:m.b.pts,
      evPts: right ? per : 0,
    };
  });
  let pts = nCorrect*per + (nCorrect===mus.length ? bonus : 0);
  return {pts, events, perfect: nCorrect===mus.length, bonus};
}

let lbPredHistoryCache=null; // {sub, mode, byUser:{uname:[entry]}}

function demoHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function demoRng(seed){let s=seed||1;return function(){s=Math.imul(s^s>>>15,2246822519);s=Math.imul(s^s>>>13,3266489917);return ((s^=s>>>16)>>>0)/4294967296;};}

function demoScoreBreakdown(comp,round,uname,target){
  const rng=demoRng(demoHash(uname+'|'+round.id));
  const evs=(round.eventIds||[]).map(id=>({id,...EVENTS[id]})).filter(e=>e&&e.res);
  const order=[...evs].sort(()=>rng()-0.5);
  const s=comp.scoring||{exactScore:5,homeGoals:2,awayGoals:2,totalGoals:1};
  let remaining=target;
  const out=[];
  order.forEach(ev=>{
    let outcome='zero';
    if(remaining>=s.exactScore) outcome='exact';
    else if(remaining>=Math.min(s.homeGoals,s.awayGoals)) outcome=rng()<0.5?'home':'away';
    else if(remaining>=s.totalGoals&&(ev.res.h+ev.res.a)>0) outcome='total';
    let pick,pts=0,text='No points scored';
    if(outcome==='exact'){pick={h:ev.res.h,a:ev.res.a};pts=s.exactScore;text='Exact score correct';}
    else if(outcome==='home'){pick={h:ev.res.h,a:ev.res.a+1+Math.floor(rng()*2)};pts=s.homeGoals;text='Home team goals correct';}
    else if(outcome==='away'){pick={h:ev.res.h+1+Math.floor(rng()*2),a:ev.res.a};pts=s.awayGoals;text='Away team goals correct';}
    else if(outcome==='total'){
      if(ev.res.h!==ev.res.a){pick={h:ev.res.a,a:ev.res.h};}
      else{pick={h:ev.res.h+1,a:Math.max(0,ev.res.a-1)};}
      pts=s.totalGoals;text='Total goals correct';
    } else {pick={h:ev.res.h+1,a:ev.res.a+2};}
    remaining-=pts;
    out.push({home:ev.home,away:ev.away,res:ev.res,pick,pts,text,evPts:pts});
  });
  return {pts:out.reduce((t,e)=>t+e.pts,0),events:out};
}

// Reverse-engineers a plausible per-market breakdown from a user's target
// score. Written generically over comp.markets rather than hardcoded to the
// football market set, so it works for any sport's markets (e.g. the
// basketball winner/margin pair) without special-casing.
function demoBettingBreakdown(comp,round,uname,target){
  const rng=demoRng(demoHash(uname+'|'+round.id));
  const evs=(round.eventIds||[]).map(id=>({id,...EVENTS[id]})).filter(e=>e&&e.res);
  const order=[...evs].sort(()=>rng()-0.5);
  const mkts=comp.markets||[];

  function actualFor(mkt,ev){
    if(mkt.type==='1x2') return ev.res.h>ev.res.a?'H':ev.res.h<ev.res.a?'A':'D';
    if(mkt.type==='ou25') return (ev.res.h+ev.res.a)>2.5?'O':'U';
    if(mkt.type==='btts') return (ev.res.h>0&&ev.res.a>0)?'Y':'N';
    if(mkt.type==='winner') return ev.res.h>ev.res.a?'H':'A';
    if(mkt.type==='margin') return marginBucket(Math.abs(ev.res.h-ev.res.a));
    return null;
  }
  function wrongFor(mkt,actual){
    let pool=[];
    if(mkt.type==='1x2') pool=['H','D','A'];
    else if(mkt.type==='ou25') pool=['O','U'];
    else if(mkt.type==='btts') pool=['Y','N'];
    else if(mkt.type==='winner') pool=['H','A'];
    else if(mkt.type==='margin') pool=MARGIN_BUCKETS.map(b=>b.key);
    pool=pool.filter(x=>x!==actual);
    return pool.length?pool[Math.floor(rng()*pool.length)]:actual;
  }

  // Greedily award correct picks until the target points are used up.
  let remaining=target;
  const out=[];
  order.forEach(ev=>{
    const markets=[];let evPts=0;
    mkts.forEach(mkt=>{
      const actual=actualFor(mkt,ev);
      const pts=mkt.points||0;
      const take = pts>0 && remaining>=pts;
      let pick;
      if(take){ pick=actual; evPts+=pts; remaining-=pts; }
      else { pick=wrongFor(mkt,actual); }
      markets.push({mkt,pick,isRight:take,pts:take?pts:0});
    });
    out.push({home:ev.home,away:ev.away,res:ev.res,markets,evPts});
  });
  return {pts:out.reduce((t,e)=>t+e.evPts,0),events:out};
}

function demoPickLabel(mkt,pick){
  if(pick==null)return '\u2014';
  if(mkt.type==='1x2')return pick==='H'?'Home Win':pick==='D'?'X':'Away';
  if(mkt.type==='ou25')return pick==='O'?'Over':'Under';
  if(mkt.type==='btts')return pick==='Y'?'Yes':'No';
  if(mkt.type==='winner')return pick==='H'?'Home':'Away';
  if(mkt.type==='margin')return marginLabel(pick);
  return pick;
}

        </span>

      h.markets.forEach(m=>{
        body+=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;font-size:12.5px;">

function lbInitials(name){

}
function ordinal(n){
  const s=['th','st','nd','rd'], v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}
function buildLBTable(title,sub,rows,cellFn,colHeader,prizes,extraCellFn,extraColHeader,extra2CellFn,extra2ColHeader){
  const me=currentUser;
  const prizeMap={};
  (prizes||[]).forEach(p=>{prizeMap[p.pos]=p.text;});
  const hasPrizes=Object.keys(prizeMap).length>0;
  const hasExtra=!!extraCellFn;
  const extraColHeaderMobile = extraColHeader ? extraColHeader.replace('<th ','<th class="lb-col-extra" ') : extraColHeader;
  const hasExtra2=!!extra2CellFn;
  const extra2ColHeaderMobile = extra2ColHeader ? extra2ColHeader.replace('<th ','<th class="lb-col-extra2" ') : extra2ColHeader;
  const medalColor={1:'#e8b53a',2:'#b9c0cc',3:'#cd8a52'};
  const prizeIcon={1:'🏆',2:'🥈',3:'🥉'};
  const prizeBg={1:'#fbf1cf',2:'#eef0f4',3:'#f4e3d3'};
  let html=`<div class="lb-wrap"><table class="lb-table" style="table-layout:fixed;"><thead><tr><th style="width:32px;text-align:center">#</th><th style="width:auto;">Player</th>${colHeader}${hasExtra?extraColHeaderMobile:''}${hasExtra2?extra2ColHeaderMobile:''}${hasPrizes?'<th style="width:56px;text-align:center;">Prize</th>':''}</tr></thead><tbody>`;
  rows.forEach(row=>{
    const isMe=row.u===me;
    const rankColor=row.rank<=3?medalColor[row.rank]:'var(--text-3)';
    const avatarBg=isMe?'linear-gradient(135deg,var(--accent),oklch(0.62 0.15 275))':'oklch(0.94 0.006 260)';
    const prizeText=prizeMap[row.rank];
    const icon=prizeIcon[row.rank]||'🏆';
    const bg=prizeBg[row.rank]||'oklch(0.95 0.02 275)';
    let prizeCell='';
    if(hasPrizes){
      if(prizeText){
        const safeText=prizeText.replace(/</g,'&lt;').replace(/"/g,'&quot;');
        prizeCell=`<td style="width:56px;"><div class="prize-cell-wrap"><div class="prize-badge" style="background:${bg};">${icon}<span class="prize-info-dot">i</span></div><div class="prize-tooltip"><div class="prize-tooltip-title">${ordinal(row.rank)} place prize</div><div class="prize-tooltip-desc">${safeText}</div><div class="prize-tooltip-arrow"></div></div></div></td>`;
      } else {
        prizeCell=`<td style="width:56px;" title="No prize for this position"><div style="display:flex;align-items:center;justify-content:center;"><span style="color:var(--text-3);">—</span></div></td>`;
      }
    }
    const extraCell = hasExtra ? extraCellFn(row).replace('<td ','<td class="lb-col-extra" ') : '';
    const extra2Cell = hasExtra2 ? extra2CellFn(row).replace('<td ','<td class="lb-col-extra2" ') : '';
    html+=`<tr class="${isMe?'me':''}"><td class="lb-rank" style="color:${rankColor};">${row.rank}</td><td><div style="display:flex;align-items:center;gap:8px;min-width:0;"><div style="width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:${isMe?'#fff':'var(--text-2)'};background:${avatarBg};">${lbInitials(row.u)}</div><span class="lb-uname ${isMe?'me':''}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${row.u}</span>${isMe?'<span style="flex-shrink:0;margin-left:2px;font-size:9px;font-weight:800;color:var(--accent);background:var(--accent-light);padding:2px 6px;border-radius:5px;letter-spacing:0.3px;">YOU</span>':''}</div></td>${cellFn(row)}${extraCell}${extra2Cell}${prizeCell}</tr>`;
  });
  html+='</tbody></table></div>';return html;
}

// ── PROFILE ───────────────────────────────────────────────────────────────
function renderProfile(){
  const totalPreds=Object.keys(preds).length;
  const hitCount=Object.entries(preds).reduce((acc,[eid,pred])=>{
    const ev=EVENTS[eid];if(!ev||!ev.res)return acc;
    if(typeof pred==='object'&&pred.h!==undefined){
      if(parseInt(pred.h)==ev.res.h&&parseInt(pred.a)==ev.res.a)return acc+1;
    } else if(typeof pred==='string'){
      const actual=ev.res.h>ev.res.a?'H':ev.res.h<ev.res.a?'A':'D';
      if(pred===actual)return acc+1;
    }
    return acc;
  },0);
  const resultedPreds=Object.entries(preds).filter(([eid])=>EVENTS[eid]?.res).length;
  const hitRate=resultedPreds>0?Math.round(hitCount/resultedPreds*100):0;

  // Fake competition data for demo
  const activeComps=[
    {name:'Score Predictor',mode:'score',points:18,rank:2,total:6},
    {name:'Betting Markets',mode:'betting',points:10,rank:3,total:5},
  ];
  const endedComps=[];

  document.getElementById('profile-content').innerHTML=`
    <div style="padding:10px 16px 0;"><button onclick="goTab('predict')" style="background:none;border:none;cursor:pointer;font-size:13px;color:var(--accent);font-weight:700;font-family:var(--mono);">← Back to predictions</button></div>
    <div class="profile-header"><div class="profile-av">DE</div><div class="profile-name">demo_user</div><div class="profile-joined">Demo account</div></div>
    <div class="profile-stats">
      <div class="profile-stat"><div class="ps-val">${totalPreds}</div><div class="ps-label">Total Predictions</div></div>
      <div class="profile-stat"><div class="ps-val">${hitRate}%</div><div class="ps-label">Hit Rate</div></div>
      <div class="profile-stat"><div class="ps-val">${COMPS.length}</div><div class="ps-label">Competitions</div></div>
    </div>
    <div class="profile-section">
      <div class="profile-section-title">Active Competitions</div>
      ${activeComps.map(c=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);">
        <div style="width:4px;height:32px;border-radius:2px;background:${c.mode==='score'?'#4F46E5':c.mode==='lms'?'#DC2626':'#059669'};flex-shrink:0;"></div>
        <div style="flex:1;min-width:0;">
          <div style="font-family:var(--mono);font-size:12px;font-weight:700;color:var(--text);">${c.name}</div>
          <div style="font-size:10px;color:var(--text-3);">${MODE_LABELS[c.mode]}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-family:var(--mono);font-size:14px;font-weight:800;color:var(--text);">${c.points} pts</div>
          <div style="font-size:10px;color:var(--text-3);">#${c.rank} of ${c.total}</div>
        </div>
      </div>`).join('')}
    </div>
    <div class="profile-section">
      <div class="profile-section-title">Ended Competitions</div>
      ${endedComps.map(c=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);opacity:0.7;">
        <div style="width:4px;height:32px;border-radius:2px;background:${c.mode==='score'?'#4F46E5':c.mode==='lms'?'#DC2626':'#059669'};flex-shrink:0;"></div>
        <div style="flex:1;min-width:0;">
          <div style="font-family:var(--mono);font-size:12px;font-weight:700;color:var(--text);">${c.name}</div>
          <div style="font-size:10px;color:var(--text-3);">${c.note||MODE_LABELS[c.mode]}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-family:var(--mono);font-size:14px;font-weight:800;color:var(--text);">${c.points} pts</div>
          <div style="font-size:10px;color:var(--text-3);">#${c.rank} of ${c.total}</div>
        </div>
      </div>`).join('')}
    </div>
    <div class="profile-section" style="padding-top:8px;">
      <div style="font-size:11px;color:var(--text-3);background:var(--bg);padding:10px;border-radius:6px;">This is a demo. In the live embed, users register with their own email and password.</div>
    </div>`;
}

renderCompTabs();goTab('predict');

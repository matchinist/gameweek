name: CI
# Phase 2.7 — the same gates the deploy runs, for branches and pull requests
# (Cloudflare preview deploys in 2.6 hang off green CI here).
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Unit tests
        run: pnpm vitest run
      - name: Migration suites (node --test)
        run: node --test scripts/kickoff-backfill/parse-kickoff.test.mjs scripts/kickoff-backfill/report.test.mjs
      - name: Duplicate-declaration + forbidden-pattern gate
        run: node scripts/build/ci-checks.mjs
      - name: Build and verify _site
        run: scripts/build/parity-test.sh
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Embed-contract tests (classic render, inline handshake, SSO origin gate)
        run: pnpm run test:contract
      # Preview deploy for branches/PRs from this repo (fork PRs get no
      # secrets, so the step is skipped there). The branch name goes through
      # an env var — never interpolated into the script — and produces a
      # <branch>.gameweek.pages.dev preview URL.
      - name: Preview deploy to Cloudflare Pages
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "no CF secrets — skipping preview"; exit 0; fi
          pnpm exec wrangler pages deploy _site --project-name=gameweek --branch="$BRANCH" --commit-dirty=true

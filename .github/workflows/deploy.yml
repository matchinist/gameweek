name: Deploy static site to Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build all apps and assemble _site/ (scripts/build/assemble-site.mjs IS
      # the deploy allowlist from Phase 0.6 — a file ships only by being
      # listed there), then the parity gate verifies the output shape and
      # that nothing non-allowlisted leaked before anything is uploaded.
      - name: Typecheck (packages + build scripts)
        run: pnpm exec tsc --noEmit
      - name: Unit tests (packages + anti-drift guards)
        run: pnpm vitest run
      - name: Duplicate-declaration + forbidden-pattern gate
        run: node scripts/build/ci-checks.mjs
      - name: Build and verify _site
        run: scripts/build/parity-test.sh
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Embed-contract tests (classic render, inline handshake, SSO origin gate)
        run: pnpm run test:contract
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4

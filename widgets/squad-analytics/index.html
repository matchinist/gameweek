  html,body{height:100%;}

<body>
<div id="root" style="padding:12px;">
  <div style="text-align:center;padding:60px 20px;color:#8a8b98;font-size:13px;">Loading squad analytics…</div>
</div>
<script>
const SUPA_URL = 'https://mgfzqkesikfdrahherfm.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nZnpxa2VzaWtmZHJhaGhlcmZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NjA5ODAsImV4cCI6MjA5NTAzNjk4MH0.uzhqaPtsEE-dthbpv1tl6krZj7FidfTblV_7ilcAxFI';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY, {auth:{persistSession:false}});
const CLIENT_KEY = new URLSearchParams(location.search).get('client') || '';
const SEASON = '2026/27';
const LEAGUE_NAME_MATCH = 'premier league'; // default league for this widget, per spec

let sqaState = { level:'consistency', metricKey:'started', minPct:50 };
const SQA_DEFS = [
  { group:'consistency', key:'started',   short:'Started',       label:'Started players',    caption:'Distinct players given a start this season. Fewer means a more settled first XI.' },
  { group:'consistency', key:'minutes',   short:'Participation', label:'Participated players', caption:'Players covering at least the chosen share of the club\u2019s total available minutes this season.' },
  { group:'consistency', key:'lineups',   short:'Lineups',       label:'Different lineups',   caption:'Distinct starting XI combinations fielded this season. Fewer means the manager keeps naming the same team.' },
  { group:'consistency', key:'avgChange', short:'Avg change',    label:'Avg change / game',   caption:'Average number of starters swapped between consecutive matches. Lower means more lineup continuity.' },
  { group:'demographics', key:'nations',  short:'Nationalities', label:'Nationalities used',  caption:'Distinct nationalities used. Not tracked yet — player nationality isn\u2019t recorded in Data Manager.' },
  { group:'demographics', key:'avgAge',   short:'Avg age',       label:'Average age of XI',   caption:'Mean age of players fielded. Not tracked yet — player date of birth isn\u2019t recorded in Data Manager.' },
  { group:'demographics', key:'zodiac',   short:'Zodiac',        label:'Most popular zodiac', caption:'Most common star sign in the squad. Not tracked yet — player date of birth isn\u2019t recorded in Data Manager.' },
];

let CLUBS = []; // [{id,name,logo,startedIds,startedNames,lineupsCount,avgChange,minutesByPlayer,totalMatches}]
let LOAD_ERROR = null;
let GW_NUMBER = null; // rough matchday count used for the header sub-line

// ── Minutes-played logic ────────────────────────────────────────────────
// - Never subbed off  -> 90
// - Subbed off        -> the minute they came off
// - Subbed on         -> (90 + overtime) minus the minute they came on,
//                        unless they were themselves later subbed off, in
//                        which case it's (their own sub-off minute) minus
//                        (their own sub-on minute).
function computeClubStats(events, playerTeamOf, clubId){
  const startedSet = new Set();
  const lineupCombos = new Set();
  const minutesByPlayer = {};
  const lineupsChron = [];
  let totalMatches = 0;

  events.forEach(e=>{
    const side = e.home_id===clubId ? e.lineup?.home : (e.away_id===clubId ? e.lineup?.away : null);
    if(!side) return;
    const xi = (Array.isArray(side) ? side : Object.values(side)).filter(Boolean);
    if(!xi.length) return;
    totalMatches++;
    xi.forEach(pid=>startedSet.add(pid));
    lineupCombos.add([...xi].sort().join(','));
    lineupsChron.push({ kickoff: e.kickoff, xi: new Set(xi) });

    const overtime = e.result?.overtime || 0;
    const finalMinute = 90 + overtime;
    const clubSubs = (e.scorers||[]).filter(s=>s.type==='sub' && (playerTeamOf[s.outId]===clubId || playerTeamOf[s.inId]===clubId));
    const subOffMinute = {}, subOnMinute = {};
    clubSubs.forEach(s=>{
      if(s.outId!=null) subOffMinute[s.outId]=s.minute;
      if(s.inId!=null) subOnMinute[s.inId]=s.minute;
    });

    xi.forEach(pid=>{
      const mins = subOffMinute[pid]!=null ? subOffMinute[pid] : 90;
      minutesByPlayer[pid] = (minutesByPlayer[pid]||0) + mins;
    });
    Object.keys(subOnMinute).forEach(pid=>{
      if(xi.includes(pid)) return; // already a starter, already counted above
      let mins = subOffMinute[pid]!=null
        ? (subOffMinute[pid] - subOnMinute[pid])   // subbed on, then subbed off again
        : (finalMinute - subOnMinute[pid]);        // subbed on, played to full time
      if(mins<0) mins = 0;
      minutesByPlayer[pid] = (minutesByPlayer[pid]||0) + mins;
    });
  });

  lineupsChron.sort((a,b)=> new Date(a.kickoff) - new Date(b.kickoff));
  let totalChange=0, pairs=0;
  for(let i=1;i<lineupsChron.length;i++){
    const prev=lineupsChron[i-1].xi, cur=lineupsChron[i].xi;
    let diff=0;
    cur.forEach(pid=>{ if(!prev.has(pid)) diff++; });
    totalChange+=diff; pairs++;
  }

  return {
    startedIds:[...startedSet],
    lineupsCount: lineupCombos.size,
    avgChange: pairs ? totalChange/pairs : 0,
    minutesByPlayer, totalMatches,
  };
}

async function boot(){
  const root = document.getElementById('root');
  if(!CLIENT_KEY){
    root.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#c0392b;font-size:13px;">Missing ?client= in the widget URL.</div>';
    return;
  }
  try{
    const [{data:coverage}, {data:tournaments}, {data:teams}, {data:events}] = await Promise.all([
      supa.from('gw_client_coverage').select('*').eq('client_key',CLIENT_KEY).maybeSingle(),
      supa.from('gw_dm_tournaments').select('*'),
      supa.from('gw_dm_teams').select('*'),
      supa.from('gw_dm_events').select('*'),
    ]);

    const tourIds = coverage?.tournament_ids ? new Set(coverage.tournament_ids) : null;
    const teamIds = coverage?.team_ids ? new Set(coverage.team_ids) : null;

    const visibleTournaments = (tournaments||[]).filter(t => !tourIds || tourIds.has(t.id));
    const league = visibleTournaments.find(t => (t.name||'').toLowerCase().includes(LEAGUE_NAME_MATCH))
                || (tournaments||[]).find(t => (t.name||'').toLowerCase().includes(LEAGUE_NAME_MATCH));

    let leagueTeamIds = new Set();
    if(league && league.seasons && league.seasons[SEASON]){
      (league.seasons[SEASON].teamIds||[]).forEach(id=>leagueTeamIds.add(id));
    }
    // Fallback: if this league/season combo has no team list configured yet,
    // fall back to whatever teams are in this client's coverage so the
    // widget still shows something (rows at 0) rather than an empty page.
    if(leagueTeamIds.size===0 && teamIds){ teamIds.forEach(id=>leagueTeamIds.add(id)); }

    const allTeams = (teams||[]).filter(t => !teamIds || teamIds.has(t.id));
    const clubTeams = allTeams.filter(t => leagueTeamIds.size===0 || leagueTeamIds.has(t.id));

    // Restrict to fixtures strictly between two of this league's own clubs,
    // so a cup tie against an outside opponent doesn't get counted in.
    const clubIdSet = new Set(clubTeams.map(t=>t.id));
    const leagueEvents = (events||[]).filter(e => clubIdSet.has(e.home_id) && clubIdSet.has(e.away_id) && e.lineup);

    // Full roster for these clubs — needed to resolve which team a sub
    // event's players belong to (scorers don't carry a team id directly),
    // and to show real names in the detail modals.
    const {data:rosterPlayers} = await supa.from('gw_dm_players').select('id,full_name,team_id').in('team_id',clubTeams.map(t=>t.id));
    const playerTeamOf = {}, nameMap = {};
    (rosterPlayers||[]).forEach(p=>{ playerTeamOf[p.id]=p.team_id; nameMap[p.id]=p.full_name; });

    CLUBS = clubTeams.map(t=>{
      const stats = computeClubStats(leagueEvents, playerTeamOf, t.id);
      return {
        id:t.id, name:t.name, logo:t.logo||'',
        startedCount: stats.startedIds.length,
        startedIds: stats.startedIds,
        startedNames: stats.startedIds.map(id=>nameMap[id]||id),
        lineupsCount: stats.lineupsCount,
        avgChange: stats.avgChange,
        minutesByPlayer: stats.minutesByPlayer,
        totalMatches: stats.totalMatches,
      };
    }).sort((a,b)=>a.name.localeCompare(b.name));

    GW_NUMBER = Math.max(1, Math.round(leagueEvents.length / Math.max(1,clubTeams.length) * 2));
  }catch(e){
    console.error('squad analytics load failed:', e);
    LOAD_ERROR = e;
  }
  render();
}

function sqaTag(text,tone){
  const c = {p:{c:'#6d4be0',bg:'#efeaff'}, g:{c:'#1f9d57',bg:'#e6f5ec'}, n:{c:'#8a8b98',bg:'#f0f0f5'}}[tone];
  return `style="display:inline-block;font-size:10.5px;font-weight:800;color:${c.c};background:${c.bg};padding:3px 9px;border-radius:7px;white-space:nowrap;flex-shrink:0;">${text}`;
}
function sqaCrest(name, url, size){
  const img = url ? `<img src="${url}" alt="" onerror="this.style.display='none';" style="width:100%;height:100%;object-fit:contain;padding:${Math.round(size*0.12)}px;box-sizing:border-box;" />` : '';
  return `<div style="position:relative;width:${size}px;height:${size}px;border-radius:${size>=32?8:6}px;background:#f4f5f8;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.06);overflow:hidden;">${img}</div>`;
}
function sqaHeatCell(v,min,max){
  if(max===min){ // every club at the same value (usually all-zero, no data yet)
    return `min-width:46px;text-align:center;padding:6px 12px;border-radius:8px;font-family:inherit;font-size:13.5px;font-weight:800;border:none;white-space:nowrap;background:#f0f0f5;color:#a3a4b0;`;
  }
  const t0 = (v-min)/(max-min);
  const t = 1-t0; // lower "started" count = better/more settled = more intense
  const alpha = 0.10 + t*0.80;
  const color = t>0.55 ? '#fff' : '#4a3aa0';
  return `min-width:46px;text-align:center;padding:6px 12px;border-radius:8px;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;border:none;white-space:nowrap;background:rgba(109,75,224,${alpha.toFixed(2)});color:${color};`;
}

function sqaMetricVal(c, key){
  switch(key){
    case 'started':   return {value:c.startedCount, sort:c.startedCount, resolved:true};
    case 'lineups':   return {value:c.lineupsCount, sort:c.lineupsCount, resolved:true};
    case 'avgChange': return {value:c.avgChange.toFixed(1), sort:c.avgChange, resolved:true};
    case 'minutes': {
      const totalPossible = c.totalMatches*90;
      const th = sqaState.minPct;
      let n = 0;
      if(totalPossible>0){
        Object.values(c.minutesByPlayer).forEach(m=>{ if((m/totalPossible*100) >= th) n++; });
      }
      return {value:n, sort:n, resolved:true};
    }
    default: return {value:0, sort:0, resolved:false};
  }
}

function render(){
  const root = document.getElementById('root');
  if(LOAD_ERROR){
    root.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#c0392b;font-size:13px;">Could not load squad analytics. Please refresh.</div>';
    return;
  }
  const defs = SQA_DEFS;
  const active = defs.find(d=>d.key===sqaState.metricKey) || defs[0];
  const isStarted = active.key==='started';
  const isDist = active.key==='minutes';
  const metricVal = c => sqaMetricVal(c, active.key);
  const resolved = CLUBS.length ? metricVal(CLUBS[0]).resolved : false;

  const rows = resolved
    ? [...CLUBS].sort((a,b)=>metricVal(a).sort - metricVal(b).sort) // lower = more settled/consistent = ranked 1st, for all 4 real metrics
    : [...CLUBS]; // demographics we can't compute yet: 0 for everyone, keep alphabetical
  const vals = rows.map(c=>metricVal(c).sort);
  const minV = Math.min(...vals,0), maxV = Math.max(...vals,0);

  const thresholdBlock = isDist ? `
    <div style="margin:6px 18px 2px;background:#faf9fc;border:1px solid #eceaf4;border-radius:12px;padding:12px 15px;">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;">
        <span style="font-size:12px;font-weight:700;color:#3a3b47;">Minimum participation</span>
        <span style="font-size:15px;font-weight:800;color:#6d4be0;">\u2265 ${sqaState.minPct}% of available minutes</span>
      </div>
      <input type="range" min="0" max="100" step="10" value="${sqaState.minPct}" oninput="sqaSetThreshold(this.value)" style="width:100%;accent-color:#6d4be0;cursor:pointer;" />
      <div style="display:flex;justify-content:space-between;margin-top:5px;font-size:9px;font-weight:700;color:#b7b8c4;">
        <span>0%</span><span>50%</span><span>100%</span>
      </div>
    </div>` : '';

  const rowsHtml = rows.map((c,i)=>{
    const val = metricVal(c).value;
    const rankColor = i<3 ? '#6d4be0' : '#a3a4b0';
    const clickAttr = isStarted ? ` onclick="sqaOpenDetail('${c.id}')"` : '';
    return `<div style="display:flex;align-items:center;padding:10px 18px;border-bottom:1px solid #f4f4f8;">
      <span style="width:26px;font-size:12.5px;font-weight:800;color:${rankColor};">${i+1}</span>
      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
        ${sqaCrest(c.name, c.logo, 24)}
        <span style="font-size:13.5px;font-weight:600;color:#1c1d26;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${c.name}</span>
      </div>
      <div style="width:110px;display:flex;justify-content:flex-end;">
        <button${clickAttr} style="${sqaHeatCell(val,minV,maxV)}">${val}</button>
      </div>
    </div>`;
  }).join('');

  const levelsHtml = [
    {key:'consistency', label:'Consistency'},
    {key:'demographics', label:'Demographics'},
  ].map(l=>{
    const on = sqaState.level===l.key;
    return `<button onclick="sqaSelectLevel('${l.key}')" style="border:none;border-radius:8px;padding:7px 16px;font-family:inherit;font-size:12.5px;font-weight:${on?800:600};cursor:pointer;white-space:nowrap;background:${on?'#fff':'transparent'};color:${on?'#6d4be0':'#8a8b98'};box-shadow:${on?'0 1px 3px rgba(20,20,40,0.12)':'none'};">${l.label}</button>`;
  }).join('');

  const subTabsList = defs.filter(d=>d.group===sqaState.level);
  const subTabsHtml = subTabsList.map(d=>{
    const on = d.key===active.key;
    return `<button onclick="sqaSelectMetric('${d.key}')" style="border:none;border-radius:8px;padding:7px 13px;font-family:inherit;font-size:12px;font-weight:${on?700:600};cursor:pointer;white-space:nowrap;background:${on?'#6d4be0':'transparent'};color:${on?'#fff':'#8a8b98'};box-shadow:${on?'0 1px 3px rgba(109,75,224,0.35)':'none'};">${d.short}</button>`;
  }).join('');
  const subSelectHtml = `<select onchange="sqaSelectMetric(this.value)" style="width:100%;border:1px solid #e6e7ee;background:#f4f5f8;border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:700;color:#3a3b47;">
    ${subTabsList.map(d=>`<option value="${d.key}"${d.key===active.key?' selected':''}>${d.label}</option>`).join('')}
  </select>`;

  const detail = sqaState.detail ? CLUBS.find(c=>c.id===sqaState.detail) : null;
  const detailModal = detail ? `<div style="position:fixed;inset:0;z-index:1200;background:rgba(20,20,40,0.45);display:flex;align-items:flex-end;justify-content:center;" onclick="if(event.target===this)sqaCloseDetail()">
    <div style="width:100%;max-width:480px;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(20,20,40,0.25);max-height:80vh;display:flex;flex-direction:column;">
      <div style="display:flex;align-items:center;gap:11px;padding:16px 18px 14px;border-bottom:1px solid #f0f0f5;flex-shrink:0;">
        ${sqaCrest(detail.name, detail.logo, 34)}
        <div style="flex:1;min-width:0;">
          <div style="font-size:15px;font-weight:800;letter-spacing:-0.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${detail.name} \u00b7 Started players</div>
          <div style="font-size:11.5px;font-weight:600;color:#8a8b98;">${detail.startedCount} distinct player${detail.startedCount===1?'':'s'} started</div>
        </div>
        <button onclick="sqaCloseDetail()" style="border:none;background:#f4f5f8;width:30px;height:30px;border-radius:50%;font-size:16px;color:#6b6c7a;cursor:pointer;flex-shrink:0;">\u00d7</button>
      </div>
      <div style="overflow-y:auto;padding:8px 12px 16px;">
        ${(detail.startedNames||[]).length ? detail.startedNames.map((name,i)=>`<div style="display:flex;align-items:center;gap:11px;padding:9px 8px;border-bottom:1px solid #f4f4f8;">
          <div style="width:24px;height:24px;border-radius:6px;background:#efeaff;color:#6d4be0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;">${i+1}</div>
          <div style="font-size:13px;font-weight:700;color:#1c1d26;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${name}</div>
        </div>`).join('') : `<div style="padding:24px;text-align:center;font-size:12.5px;color:#a3a4b0;">No lineups recorded yet for ${detail.name}.</div>`}
      </div>
    </div>
  </div>` : '';

  root.innerHTML = `<div style="font-family:'Manrope',-apple-system,Helvetica,Arial,sans-serif;color:#1c1d26;">
    <div style="background:#fff;border:1px solid #e6e7ee;border-radius:16px;box-shadow:0 2px 8px rgba(20,20,40,0.05);overflow:hidden;">
      <div style="padding:16px 18px 0;">
        <h1 style="margin:0;font-size:16px;font-weight:800;letter-spacing:-0.3px;">Squad Analytics</h1>
        <p style="margin:1px 0 0;font-size:11.5px;font-weight:600;color:#8a8b98;">Premier League ${SEASON}${GW_NUMBER?' \u00b7 through GW '+GW_NUMBER:''}</p>
        <div style="display:inline-flex;margin-top:13px;background:#f4f5f8;border:1px solid #e6e7ee;border-radius:10px;padding:3px;">${levelsHtml}</div>
      </div>
      <div class="sqa-tabs-desktop">${subTabsHtml}</div>
      <div class="sqa-tabs-mobile">${subSelectHtml}</div>
      <div style="padding:12px 18px 6px;">
        <p style="margin:0;font-size:11.5px;line-height:1.4;color:#8a8b98;">${active.caption}</p>
      </div>
      ${thresholdBlock}
      <div style="display:flex;align-items:center;padding:8px 18px;border-bottom:1px solid #f0f0f5;">
        <span style="width:26px;font-size:10px;font-weight:700;color:#a3a4b0;text-transform:uppercase;letter-spacing:0.5px;">#</span>
        <span style="flex:1;font-size:10px;font-weight:700;color:#a3a4b0;text-transform:uppercase;letter-spacing:0.5px;">Club</span>
        <span style="width:110px;text-align:right;font-size:10px;font-weight:700;color:#a3a4b0;text-transform:uppercase;letter-spacing:0.5px;">${resolved?'Value':'\u2014'}</span>
      </div>
      ${rowsHtml || '<div style="padding:28px 18px;text-align:center;font-size:12.5px;color:#a3a4b0;">No teams configured for this league yet.</div>'}
    </div>
  </div>
  ${detailModal}`;
}

function sqaSelectLevel(key){
  const first = SQA_DEFS.find(d=>d.group===key);
  sqaState = {...sqaState, level:key, metricKey:first.key};
  render();
}
function sqaSelectMetric(key){ sqaState = {...sqaState, metricKey:key}; render(); }
function sqaSetThreshold(val){ sqaState = {...sqaState, minPct:parseInt(val,10)}; render(); }
function sqaOpenDetail(id){ sqaState = {...sqaState, detail:id}; render(); }
function sqaCloseDetail(){ sqaState = {...sqaState, detail:null}; render(); }

boot();
</script>
</body>
</html>

<title>CS2 Fantasy · Gameweek</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F9FAFB;--white:#FFFFFF;--border:#E2E4EA;
  --text:#0F1117;--text-2:#6B7280;--text-3:#9CA3AF;
  --accent:#4F46E5;--accent-2:#3730A3;--accent-light:#EEF2FF;
  --green:#16A34A;--red:#DC2626;
  --mono:'Space Mono',monospace;--sans:'Inter',sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);font-family:var(--sans);color:var(--text);line-height:1.5;}
.page-wrap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);}
.page-header{padding:16px 16px 0;}
.page-header .logo{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--text);}
.page-header .logo span{color:var(--accent);}
.page-header .tag{display:inline-block;margin-top:6px;font-size:10px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;color:var(--accent);background:var(--accent-light);padding:3px 8px;border-radius:5px;}
.control-band{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(20,20,40,0.03);margin:0 0 4px;}
.ps-tab{border:none;border-radius:8px;padding:8px 14px;font-family:var(--mono);font-size:11px;font-weight:700;cursor:pointer;background:transparent;color:var(--text-2);}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--text);color:#fff;font-family:var(--mono);font-size:11px;padding:9px 18px;border-radius:6px;z-index:999;transition:transform 0.25s ease,opacity 0.25s ease;pointer-events:none;white-space:nowrap;opacity:0;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>

const COMP = { id:'cs2fantasy', name:'CS2 Fantasy', fantasyConfig:{budget:50000}, fantasyData:FANTASY_DATA };

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),1800);
}

function fantasyBadge(bg, fg, abbr, size, logoUrl){
  if(logoUrl){
    return `<div style="width:${size}px;height:${size}px;border-radius:8px;background:${bg};display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;"><img src="${logoUrl}" alt="${abbr}" style="width:100%;height:100%;object-fit:contain;padding:${Math.round(size*0.08)}px;box-sizing:border-box;"></div>`;
  }
  const fs = size>=32 ? Math.round(size*0.32) : Math.round(size*0.4);
  return `<div style="width:${size}px;height:${size}px;border-radius:8px;background:${bg};color:${fg};display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:${fs}px;font-weight:900;flex-shrink:0;letter-spacing:-0.3px;">${abbr}</div>`;
}

function renderFantasyPane(comp){
  const fd = comp.fantasyData;
  const allPlayers={};
  fd.teams.forEach(t=>t.players.forEach(p=>{allPlayers[p.id]={...p,team:t.name,teamBg:t.bg,teamFg:t.fg,teamAbbr:t.abbr,teamLogoUrl:t.logoUrl};}));
  const roster=(fd.userRoster||[]).map(pid=>allPlayers[pid]).filter(Boolean);
  const totalKills=roster.reduce((s,p)=>s+p.kills,0);
  const totalSpent=roster.reduce((s,p)=>s+p.price,0);
  const budget=comp.fantasyConfig?.budget||50000;

  let html = `<div style="padding:12px 16px 0;">
    <div class="control-band">
      <div style="font-size:15px;font-weight:800;color:var(--text);margin-bottom:2px;">${comp.name}</div>
      <div style="font-size:12px;color:var(--text-2);">Pick 5 CS2 players from any playoff team within the $${budget.toLocaleString()} budget. Scored by total kills across the bracket.</div>
      <button class="ps-tab" onclick="showFantasyRules()" style="border:1px solid var(--border);margin-top:10px;">Rules</button>
    </div>
  </div>`;

  html+=`<div style="padding:0 8px 12px;">`;
  html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 8px 10px;">
    <div><span style="font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text-3);">BUDGET</span>
      <span style="font-family:var(--mono);font-size:13px;font-weight:800;color:${totalSpent<=budget?'var(--green)':'var(--red)'};margin-left:6px;">$${(budget-totalSpent).toLocaleString()} left</span></div>
    <div style="display:flex;align-items:center;gap:6px;">
      <span style="font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text-3);">TOTAL KILLS</span>
      <span style="font-family:var(--mono);font-size:22px;font-weight:900;color:var(--accent);">${totalKills}</span>
    </div>
  </div>`;

  html+=`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px;">`;
  roster.forEach(p=>{
    html+=`<div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 8px;background:var(--white);border-radius:10px;border:1px solid var(--border);">
      <button onclick="removeFantasyPlayer('${p.id}')" style="position:absolute;top:3px;right:3px;background:none;border:none;cursor:pointer;color:var(--red);font-size:12px;padding:2px;line-height:1;">✕</button>
      ${fantasyBadge(p.teamBg,p.teamFg,p.teamAbbr,32,p.teamLogoUrl)}
      <div style="font-family:var(--mono);font-size:11px;font-weight:800;color:var(--text);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;">${p.name}</div>
      <div style="font-size:9px;color:var(--text-3);text-align:center;">$${(p.price/1000).toFixed(1)}k</div>
      <div style="font-family:var(--mono);font-size:15px;font-weight:900;color:var(--accent);">${p.kills}</div>
    </div>`;
  });
  for(let i=roster.length;i<5;i++){
    html+=`<button onclick="openFantasyPicker()" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px 4px;border-radius:10px;border:1.5px dashed var(--border);background:transparent;color:var(--accent);cursor:pointer;min-height:104px;">
      <span style="font-size:20px;font-weight:300;line-height:1;">+</span>
      <span style="font-family:var(--mono);font-size:9px;font-weight:700;">Add</span>
    </button>`;
  }
  html+=`</div>`;

  html+=`<div style="font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text-3);padding:4px 8px 8px;">MATCHES</div>`;
  fd.matches.forEach(m=>{
    const isDone=m.status==='completed';
    html+=`<div style="background:var(--white);border-radius:10px;border:1px solid var(--border);margin-bottom:8px;overflow:hidden;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;${isDone?'':'opacity:0.5;'}">
        <div style="flex:1;text-align:center;">
          <div style="font-family:var(--mono);font-size:12px;font-weight:800;color:var(--text);">${m.team1}</div>
        </div>
        <div style="padding:0 12px;text-align:center;">
          <div style="font-size:9px;color:var(--text-3);margin-bottom:2px;">${m.stage}</div>
          <div style="font-family:var(--mono);font-size:16px;font-weight:900;color:${isDone?'var(--text)':'var(--text-3)'};">${m.score}</div>
        </div>
        <div style="flex:1;text-align:center;">
          <div style="font-family:var(--mono);font-size:12px;font-weight:800;color:var(--text);">${m.team2}</div>
        </div>
      </div>`;
    if(isDone&&m.maps.length){
      html+=`<div style="border-top:1px solid var(--border);padding:8px 12px;background:var(--bg);">`;
      html+=`<div style="display:flex;gap:8px;margin-bottom:6px;">${m.maps.map(mp=>`<span style="font-family:var(--mono);font-size:10px;color:var(--text-2);background:var(--white);padding:2px 8px;border-radius:4px;border:1px solid var(--border);">${mp.name} ${mp.score}</span>`).join('')}</div>`;
      if(m.topFrags.length){
        html+=`<div style="font-size:10px;color:var(--text-3);margin-bottom:4px;">Top performers</div>`;
        html+=`<div style="display:flex;gap:6px;flex-wrap:wrap;">`;
        m.topFrags.forEach(f=>{
          const isInRoster=(fd.userRoster||[]).some(pid=>{const pp=allPlayers[pid];return pp&&pp.name===f.name;});
          html+=`<span style="font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;${isInRoster?'background:var(--accent-light);color:var(--accent);border:1px solid var(--accent);':'background:var(--bg);color:var(--text-2);border:1px solid var(--border);'}">${f.name} ${f.kills}K</span>`;
        });
        html+=`</div>`;
      }
      html+=`</div>`;
    }
    html+=`</div>`;
  });

  html+=`</div>`;
  return html;
}

function render(){
  document.getElementById('root').innerHTML = renderFantasyPane(COMP);
}

// ── Player picker (bottom sheet) ─────────────────────────────────────────
function closeLineupPicker(){
  const overlay=document.querySelector('.lineup-picker-overlay');
  if(overlay)overlay.remove();
  document.body.style.overflow='';
}
function openFantasyPicker(){
  const fd = COMP.fantasyData;
  const budget = COMP.fantasyConfig?.budget || 50000;
  const roster = fd.userRoster || [];
  const spent = roster.reduce((s,pid)=>{
    const p = fd.teams.flatMap(t=>t.players).find(pp=>pp.id===pid);
    return s + (p?p.price:0);
  }, 0);
  const remaining = budget - spent;

  const overlay = document.createElement('div');
  overlay.className = 'lineup-picker-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;';
  overlay.onclick = (e)=>{ if(e.target===overlay) closeLineupPicker(); };
  document.body.style.overflow = 'hidden';

  let html = `<div style="background:var(--white);border-radius:20px 20px 0 0;width:100%;max-width:420px;max-height:75vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:20px 0 32px;">
    <div style="padding:0 20px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);">
      <div>
        <div style="font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;">Add player</div>
        <div style="font-size:16px;font-weight:800;color:var(--text);margin-top:2px;">$${remaining.toLocaleString()} left of $${budget.toLocaleString()}</div>
      </div>
      <button onclick="closeLineupPicker()" style="background:var(--bg);border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;color:var(--text-2);">×</button>
    </div>`;

  fd.teams.forEach(team=>{
    html += `<div style="display:flex;align-items:center;gap:8px;padding:10px 20px 4px;">${fantasyBadge(team.bg,team.fg,team.abbr,20,team.logoUrl)}<span style="font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;">${team.name}</span></div>`;
    team.players.forEach(p=>{
      const already = roster.includes(p.id);
      const affordable = already || p.price <= remaining;
      const full = roster.length>=5 && !already;
      const disabled = already || !affordable || full;
      html += `<div ${disabled?'':`onclick="pickFantasyPlayer('${p.id}')"`} style="display:flex;align-items:center;gap:12px;padding:10px 20px;cursor:${disabled?'default':'pointer'};opacity:${disabled&&!already?0.4:1};">
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;font-weight:700;color:var(--text);">${p.name}</div>
          <div style="font-size:11px;color:var(--text-3);">$${p.price.toLocaleString()} \u00b7 ${p.kills} kills</div>
        </div>
        ${already?'<span style="font-size:11px;color:var(--accent);font-weight:700;">\u2713 In squad</span>':''}
      </div>`;
    });
  });

  html += '</div>';
  overlay.innerHTML = html;
  document.body.appendChild(overlay);
}
function pickFantasyPlayer(pid){
  const fd = COMP.fantasyData;
  if(!fd.userRoster) fd.userRoster = [];
  if(fd.userRoster.includes(pid) || fd.userRoster.length>=5) return;
  fd.userRoster.push(pid);
  closeLineupPicker();
  render();
}
function removeFantasyPlayer(pid){
  COMP.fantasyData.userRoster = (COMP.fantasyData.userRoster||[]).filter(id=>id!==pid);
  render();
}
function showFantasyRules(){
  let wrap=document.getElementById('rules-modal');
  if(!wrap){ wrap=document.createElement('div'); wrap.id='rules-modal'; document.body.appendChild(wrap); }
  wrap.innerHTML = `<div style="position:fixed;inset:0;z-index:1200;background:rgba(20,20,40,0.45);display:flex;align-items:center;justify-content:center;padding:20px;" onclick="if(event.target===this)this.remove()">
    <div style="background:var(--white);border-radius:16px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;padding:20px;">
      <h3 style="margin:0 0 12px;">CS2 Simple Fantasy Rules</h3>
      <div style="display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.6;color:var(--text-2);">
        <div><strong style="color:var(--text);">How to play:</strong> Pick 5 CS2 players from any of the 8 playoff teams within the $50,000 budget.</div>
        <div><strong style="color:var(--text);">Scoring:</strong> Each kill by your player earns <strong style="color:var(--green);">+1 point</strong>. Total points = sum of all your players' kills across the tournament.</div>
        <div><strong style="color:var(--text);">Budget:</strong> $50,000 total. Player prices range from $3,000 to $12,000 based on form and rating.</div>
        <div><strong style="color:var(--text);">Winning:</strong> The manager with the highest total kills from their 5-player roster wins.</div>
      </div>
    </div>
  </div>`;
}

render();
</script>
</body>
</html>

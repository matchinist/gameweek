<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gameweek Demo</title>
<meta name="description" content="Try the Gameweek prediction game — score predictions, betting markets, rankings and lineup picks, exactly as your players would see them.">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root{
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --bg:#F7F7FB; --white:#FFFFFF; --border:#E7E7EF;
    --text:#1a1a2e; --text-3:#9AA2B1; --accent:#4F46E5;
  }
  html,body{margin:0;padding:0;background:var(--bg);font-family:var(--sans);}
  .demo-shell{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 40px rgba(20,20,43,0.06);}
  .filter-bar{display:flex;gap:8px;padding:10px 16px 12px;border-bottom:1px solid var(--border);background:var(--white);position:sticky;top:0;z-index:50;}
  .filter-item{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .filter-label{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--text-3);padding-left:2px;}
  .filter-select{
    width:100%;min-width:0;appearance:none;-webkit-appearance:none;
    font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--text);
    background:var(--bg);border:1px solid var(--border);border-radius:8px;
    padding:8px 22px 8px 10px;cursor:pointer;text-overflow:ellipsis;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%239AA2B1' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 8px center;
  }
  .filter-select:focus{outline:none;border-color:var(--accent);}
  .filter-select:disabled{opacity:0.5;cursor:default;}
  @media(max-width:420px){
    .filter-bar{gap:5px;padding:9px 12px 11px;}
    .filter-select{font-size:11.5px;padding:7px 18px 7px 8px;background-position:right 6px center;}
    .filter-label{font-size:8.5px;}
  }
  .widget-frame{display:block;width:100%;border:0;background:transparent;min-height:640px;}
  .widget-title{font-size:11px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;color:var(--text-3);padding:18px 16px 6px;}
  .demo-note{font-size:11.5px;color:var(--text-3);text-align:center;padding:14px 16px 26px;}
  .demo-note a{color:var(--accent);font-weight:700;text-decoration:none;}
</style>
</head>
<body>
<div class="demo-shell">
  <div class="filter-bar" id="filter-bar"></div>
  <div id="stage"></div>
  <div class="demo-note">This is a live demo with sample data — nothing is saved.
    <a href="https://www.gameweek.cloud">Get Gameweek for your site →</a></div>
</div>

<script>
// The demo page is a thin shell (Phase 2.5): the game below is the REAL
// embed running in demo mode (client=demo → bundled dataset, zero backend),
// mounted with the same seamless loader operators paste on their own sites.
// The old 4,400-line hand-synced copy of the app is gone.
(function(){
  'use strict';
  var FEATURES = [
    {key:'score',   label:'Score Predictor', sports:['football','volleyball','tennis']},
    {key:'betting', label:'Betting Markets', sports:['football']},
    {key:'ranking', label:'Ranking',         sports:['football']},
    {key:'lineup',  label:'Lineup Predictor',sports:['football']},
  ];
  var SPORT_LABELS = {football:'Football', volleyball:'Volleyball', tennis:'Tennis'};
  // sport → comp alias for the score feature (other features are football-only)
  var SCORE_COMP = {football:'score', volleyball:'volleyball', tennis:'tennis'};
  var state = {type:'predictor', sport:'football', feature:'score'};

  function sel(id, label, opts, val, handler, disabled){
    return '<div class="filter-item"><span class="filter-label">'+label+'</span>'+
      '<select class="filter-select" id="'+id+'" onchange="'+handler+'(this.value)"'+(disabled?' disabled':'')+'>'+
      opts.map(function(o){ return '<option value="'+o.v+'"'+(o.v===val?' selected':'')+'>'+o.l+'</option>'; }).join('')+
      '</select></div>';
  }

  function renderFilters(){
    var feat = FEATURES.filter(function(f){ return f.key===state.feature; })[0] || FEATURES[0];
    var sports = state.type==='widgets' ? ['football'] : feat.sports;
    if(sports.indexOf(state.sport)===-1) state.sport = sports[0];
    document.getElementById('filter-bar').innerHTML =
      sel('f-type','Type',[{v:'predictor',l:'Predictor'},{v:'widgets',l:'Widgets'}],state.type,'gwSetType') +
      sel('f-sport','Sport',sports.map(function(s){ return {v:s,l:SPORT_LABELS[s]||s}; }),state.sport,'gwSetSport',sports.length<2) +
      sel('f-feature','Feature',
        state.type==='widgets'
          ? [{v:'widgets',l:'Standings & Analytics'}]
          : FEATURES.map(function(f){ return {v:f.key,l:f.label}; }),
        state.type==='widgets' ? 'widgets' : state.feature, 'gwSetFeature', state.type==='widgets');
  }

  function mount(){
    renderFilters();
    var stage = document.getElementById('stage');
    if(state.type==='widgets'){
      stage.innerHTML =
        '<div class="widget-title">League standings</div>'+
        '<iframe class="widget-frame" src="/widgets/standings/" title="Standings widget" scrolling="no"></iframe>'+
        '<div class="widget-title">Top scorers</div>'+
        '<iframe class="widget-frame" src="/widgets/top-scorers/" title="Top scorers widget" scrolling="no"></iframe>';
      return;
    }
    var comp = state.feature==='score' ? SCORE_COMP[state.sport] : state.feature;
    stage.innerHTML = '';
    var holder = document.createElement('div');
    holder.setAttribute('data-gameweek','');
    holder.setAttribute('data-client','demo');
    holder.setAttribute('data-comp', comp);
    stage.appendChild(holder);
    if(window.GameweekEmbed) window.GameweekEmbed.scan();
  }

  window.gwSetType = function(v){ state.type=v; mount(); };
  window.gwSetSport = function(v){ state.sport=v; mount(); };
  window.gwSetFeature = function(v){ state.feature=v; mount(); };

  mount();
})();
</script>
<script async src="/embed.js"></script>
</body>
</html>

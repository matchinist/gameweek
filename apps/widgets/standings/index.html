<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standings — Gameweek</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234F46E5'/%3E%3Ctext x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='28' font-weight='800' fill='white' text-anchor='middle'%3EGW%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#F9FAFB;--white:#FFFFFF;--border:#E2E4EA;
  --text:#0F1117;--text-2:#6B7280;--text-3:#9CA3AF;
  --accent:#4F46E5;--accent-2:#3730A3;--accent-light:#EEF2FF;--on-accent:#FFFFFF;
  --green:#16A34A;--green-light:#DCFCE7;
  --red:#DC2626;--red-light:#FEE2E2;
  --amber:#D97706;--amber-light:#FEF3C7;
  --mono:'Space Mono',monospace;--sans:'Inter',sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:16px;}
.widget{max-width:640px;margin:0 auto;background:var(--white);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px oklch(0.2 0.02 260 / 0.04),0 6px 20px oklch(0.2 0.02 260 / 0.03);}
.w-header{padding:16px 18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.w-title{font-size:15px;font-weight:800;letter-spacing:-0.2px;}
table{width:100%;border-collapse:collapse;}
thead th{font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:0.4px;text-align:center;padding:9px 4px;border-bottom:1px solid var(--border);}
thead th.col-team{text-align:left;padding-left:14px;}
thead th.col-rank{padding-left:14px;text-align:left;width:26px;}
tbody td{font-size:12.5px;padding:9px 4px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
td.col-rank{padding-left:14px;text-align:left;position:relative;}
td.col-rank .zone-bar{position:absolute;left:0;top:0;bottom:0;width:3px;}
td.col-team{text-align:left;padding-left:10px;font-weight:600;}
.team-cell{display:flex;align-items:center;gap:8px;min-width:0;}
.team-badge{width:20px;height:20px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:var(--text-2);background:var(--bg);overflow:hidden;}
.team-badge img{width:100%;height:100%;object-fit:contain;}
.team-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;}
td.col-pts{font-weight:800;font-family:var(--mono);color:var(--text);}
td.col-diff{font-family:var(--mono);color:var(--text-2);}
td.col-diff.pos{color:var(--green);}
td.col-diff.neg{color:var(--red);}
.w-legend{padding:12px 18px 14px;display:flex;flex-wrap:wrap;gap:12px 16px;border-top:1px solid var(--border);}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-2);}
.legend-swatch{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.w-empty,.w-error{padding:40px 20px;text-align:center;color:var(--text-3);font-size:13px;}
.w-loading{padding:40px 20px;text-align:center;color:var(--text-3);font-size:12.5px;font-family:var(--mono);}
.sponsor-banner{margin:12px 12px 0;padding:12px 16px;background:var(--accent-light);border:1px solid var(--accent);border-radius:14px;display:flex;align-items:center;gap:12px;}
.sponsor-badge{width:36px;height:36px;border-radius:9px;background:var(--accent);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--on-accent);font-weight:800;font-size:14px;}
.sponsor-badge img{width:100%;height:100%;object-fit:cover;}
.sponsor-label{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:0.6px;color:var(--accent);text-transform:uppercase;}
.sponsor-brand{font-size:14.5px;font-weight:800;color:var(--text);margin-top:1px;}
@media(max-width:420px){
  .col-p,.col-w,.col-d,.col-l{display:none;}
}
</style>
</head>
<body>
<div class="widget" id="widget">
  <div class="w-loading">Loading standings…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js" integrity="sha384-ysv13JVP3fufiEXfjML9OdCa/rRbMJvUBOWyor82wfuK8INNZAvmbxHgKIHi+oqz" crossorigin="anonymous"></script>
<script src="https://browser.sentry-cdn.com/10.72.0/bundle.min.js" integrity="sha384-CJFiRXW+X61SiwyHeuiHWqxTNgAMz3wwQn6/0t+i/Nvkq2VdGFNfEOu3XFmS9ogm" crossorigin="anonymous"></script>
<script>
// Sentry error tracking (Phase 2.8). Errors only — no tracing, no PII, no
// user context; the DSN is a publishable ingest key (same philosophy as the
// Supabase anon key). Guarded so a blocked CDN never breaks the app.
if(window.Sentry){
  Sentry.init({
    dsn:'https://2f850c43742de022613e346d71c5e6f6@o4512000226557952.ingest.de.sentry.io/4512000232652880',
    environment: location.hostname==='www.gameweek.cloud' ? 'production' : 'preview',
    ignoreErrors:[
      'ResizeObserver loop', // benign Chromium noise, esp. inside iframes
      /extension:\/\//, /^chrome:\/\//, /moz-extension/,
    ],
  });
  Sentry.setTag('app','widget-standings');
  try{var gwCk=new URLSearchParams(location.search).get('client'); if(gwCk) Sentry.setTag('client_key', gwCk);}catch(e){}
}
</script>
<script>
const SUPA_URL = 'https://mgfzqkesikfdrahherfm.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nZnpxa2VzaWtmZHJhaGhlcmZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NjA5ODAsImV4cCI6MjA5NTAzNjk4MH0.uzhqaPtsEE-dthbpv1tl6krZj7FidfTblV_7ilcAxFI'; // same anon key used in gameweek-live.html
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

const params = new URLSearchParams(location.search);
const TOURNAMENT_ID = params.get('tournament');
const SEASON = params.get('season');
const CLIENT = params.get('client');

// ── theme helpers (same logic as gameweek-live.html, kept in sync) ──
function gwLum(hex){
  var h = String(hex||'').replace('#','');
  if(h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(h.length<6) return null;
  var v = [0,2,4].map(function(i){
    var c = parseInt(h.substr(i,2),16)/255;
    return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4);
  });
  return 0.2126*v[0] + 0.7152*v[1] + 0.0722*v[2];
}
function gwContrast(a,b){
  var la=gwLum(a), lb=gwLum(b);
  if(la==null||lb==null) return 21;
  return (Math.max(la,lb)+0.05)/(Math.min(la,lb)+0.05);
}
function gwApplySemantics(root, surface){
  var dark = (gwLum(surface) != null) && gwLum(surface) < 0.4;
  root.setProperty('--green', dark ? '#4ADE80' : '#16A34A');
  root.setProperty('--red',   dark ? '#F87171' : '#DC2626');
  root.setProperty('--green-light', dark ? 'rgba(74,222,128,0.16)' : '#DCFCE7');
  root.setProperty('--red-light',   dark ? 'rgba(248,113,113,0.16)' : '#FEE2E2');
}
function gwReadableText(text, surface){
  if(!text || !surface) return text;
  if(gwContrast(text, surface) >= 3) return text;
  return gwContrast('#111111', surface) >= gwContrast('#FFFFFF', surface) ? '#111111' : '#FFFFFF';
}
function applyTheme(t){
  if(!t) return;
  const root = document.documentElement.style;
  if(t.accent_color){
    root.setProperty('--accent', t.accent_color);
    root.setProperty('--accent-2', t.accent_color);
    root.setProperty('--accent-light', t.accent_color+'1A');
    root.setProperty('--on-accent', gwReadableText('#FFFFFF', t.accent_color));
  }
  if(t.bg_color) root.setProperty('--bg', t.bg_color);
  if(t.surface_color) root.setProperty('--white', t.surface_color);
  gwApplySemantics(root, t.surface_color || '#FFFFFF');
  if(t.text_color){
    const txt = gwReadableText(t.text_color, t.surface_color || '#FFFFFF');
    root.setProperty('--text', txt);
    root.setProperty('--text-2', txt+'B3');
    root.setProperty('--text-3', txt+'80');
    root.setProperty('--border', txt+'26');
  }
}
if(CLIENT){
  try{
    const cached = localStorage.getItem('gw_theme_'+CLIENT);
    if(cached) applyTheme(JSON.parse(cached));
  }catch(e){}
}

// The cache above is only a fast pre-paint for browsers that happen to
// already have it (e.g. from visiting the main prediction widget earlier)
// — it is NOT a reliable source on its own. A real visitor loading this
// as a third-party iframe on the client's own site typically never has
// that cache at all (browsers increasingly partition/block third-party
// iframe storage by default), so the widget must always fetch the actual
// theme from Supabase too, the same way the main widget does — this is
// what makes the correct colors show up for real site visitors, not just
// in a browser that's already visited gameweek.cloud directly.
// ── Language ──────────────────────────────────────────────────────────────
// Column headers translate fully. Zone labels (Champions League, Europa
// League, Relegation, etc.) are free text the admin typed when pasting
// standings data, so there's no guaranteed way to translate arbitrary
// custom text — instead this recognises the common, standard football
// qualification/relegation zone names by keyword and swaps in the correct
// translation for those; anything unrecognised (a custom zone name) is
// shown exactly as the admin typed it rather than guessed at.
let LANG = 'en';
const I18N = {
  en: { team:'Team', p:'P', w:'W', d:'D', l:'L', gd:'GD', pts:'Pts' },
  tr: { team:'Takım', p:'O', w:'G', d:'B', l:'M', gd:'AVG', pts:'Puan' },
  de: { team:'Team', p:'Sp', w:'S', d:'U', l:'N', gd:'TD', pts:'Pkt.' },
  pt: { team:'Equipa', p:'J', w:'V', d:'E', l:'D', gd:'SG', pts:'Pts' },
};
function t(key){ return (I18N[LANG]||I18N.en)[key] || key; }

const ZONE_LABEL_TRANSLATIONS = [
  [/champions?\s*league/i, {en:'Champions League', tr:'Şampiyonlar Ligi', de:'Champions League', pt:'Liga dos Campeões'}],
  [/europa\s*league/i, {en:'Europa League', tr:'Avrupa Ligi', de:'Europa League', pt:'Liga Europa'}],
  [/conference\s*league/i, {en:'Conference League', tr:'Konferans Ligi', de:'Conference League', pt:'Liga Conferência'}],
  [/relegat.*play[\s-]?off/i, {en:'Relegation Playoffs', tr:'Küme Düşme Play-off', de:'Abstiegs-Playoffs', pt:'Play-off de Despromoção'}],
  [/relegat/i, {en:'Relegation', tr:'Küme Düşme', de:'Abstieg', pt:'Despromoção'}],
  [/play[\s-]?off/i, {en:'Playoffs', tr:'Play-off', de:'Playoffs', pt:'Play-off'}],
];
function translateZoneLabel(label){
  const hit = ZONE_LABEL_TRANSLATIONS.find(([re])=>re.test(label));
  return hit ? (hit[1][LANG]||hit[1].en) : label; // unrecognised custom label — show as typed
}

async function fetchOperatorTheme(){
  if(!CLIENT || CLIENT==='demo') return null;
  try{
    const {data:op} = await supa.from('gw_operators_public').select('accent_color,bg_color,surface_color,text_color').eq('client_key',CLIENT).maybeSingle();
    if(op){ try{ localStorage.setItem('gw_theme_'+CLIENT, JSON.stringify(op)); }catch(e){} }
    return op||null;
  }catch(e){
    console.error('operator theme fetch failed:', e);
    return null;
  }
}

async function fetchOperatorLanguage(){
  if(!CLIENT || CLIENT==='demo') return 'en';
  try{
    const {data:op} = await supa.from('gw_operators_public').select('language').eq('client_key',CLIENT).maybeSingle();
    return (op && I18N[op.language]) ? op.language : 'en';
  }catch(e){
    return 'en';
  }
}

// Zone colours cycle through a fixed, readable palette in the order zones
// first appear (top of table down) — European spots green-ish, relegation
// red-ish, everything else neutral, matching the convention every football
// fan already recognises from Sofascore/league sites.
const ZONE_PALETTE = ['var(--accent)','var(--green)','#0EA5E9','var(--amber)','var(--red)','#8B5CF6'];

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function sponsorBannerHtml(campaign){
  if(!campaign) return '';
  const badge = campaign.logo_url
    ? `<img src="${escapeHtml(campaign.logo_url)}" alt="">`
    : escapeHtml((campaign.brand_name||'?').trim()[0]||'?').toUpperCase();
  return `<div class="sponsor-banner">
    <div class="sponsor-badge">${badge}</div>
    <div><div class="sponsor-label">Sponsored by</div><div class="sponsor-brand">${escapeHtml(campaign.brand_name)}</div></div>
  </div>`;
}

async function fetchActiveSponsor(){
  if(!CLIENT) return null;
  try{
    const {data} = await supa.from('gw_campaigns').select('brand_name,logo_url,widget_keys')
      .eq('client_key', CLIENT).eq('status','active').eq('type','widget_sponsorship');
    return (data||[]).find(c=>(c.widget_keys||[]).includes('standings')) || null;
  }catch(e){
    console.error('sponsor fetch failed:', e);
    return null;
  }
}

function teamBadge(team){
  if(team && team.logo){
    return `<div class="team-badge"><img src="${escapeHtml(team.logo)}" alt=""></div>`;
  }
  const initials = (team?.name||'??').replace(/[^A-Za-z0-9 ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase() || '?';
  return `<div class="team-badge">${initials}</div>`;
}

async function boot(){
  const el = document.getElementById('widget');
  if(!TOURNAMENT_ID){
    el.innerHTML = `<div class="w-error">No tournament specified. Add ?tournament=ID to the widget URL.</div>`;
    return;
  }

  const [{data:tRow, error:tErr}, {data:teamRows}, {data:stRows}, {data:zoneRows}, sponsor, opResult, langResult] = await Promise.all([
    supa.from('gw_dm_tournaments').select('id,name,country').eq('id', TOURNAMENT_ID).maybeSingle(),
    supa.from('gw_dm_teams').select('id,name,logo').limit(10000),
    supa.from('gw_dm_standings').select('*').eq('tournament_id', TOURNAMENT_ID).is('round_id', null),
    supa.from('gw_dm_standing_zones').select('*').eq('tournament_id', TOURNAMENT_ID).order('sort'),
    fetchActiveSponsor(),
    fetchOperatorTheme(),
    fetchOperatorLanguage(),
  ]);
  if(opResult) applyTheme(opResult);
  LANG = langResult || 'en';

  if(tErr || !tRow){
    el.innerHTML = `<div class="w-error">Couldn't load this tournament.</div>`;
    return;
  }

  // Standings live in their own tables (DB redesign R1; the seasons blob
  // retired in R4).
  let seasonKey, standings = null;
  const tableKeys = [...new Set((stRows||[]).map(r=>r.season_key))].sort().reverse();
  if(tableKeys.length){
    seasonKey = (SEASON && tableKeys.includes(SEASON)) ? SEASON : tableKeys[0];
    standings = {
      zones: (zoneRows||[]).filter(z=>z.season_key===seasonKey).map(z=>({id:z.zone_id, name:z.name, color:z.color})),
      rows: (stRows||[]).filter(r=>r.season_key===seasonKey).map(r=>({
        rank:r.rank, name:r.name, teamId:r.team_id,
        played:r.played, w:r.w, d:r.d, l:r.l, diff:r.diff, gf:r.gf, ga:r.ga, pts:r.pts, zoneId:r.zone_id,
      })),
    };
  }

  if(!standings || !standings.rows || !standings.rows.length){
    el.innerHTML = `${sponsorBannerHtml(sponsor)}<div class="w-header"><div><div class="w-title">${escapeHtml(tRow.name)}</div></div></div>
      <div class="w-empty">Standings haven't been added for this season yet.</div>`;
    return;
  }

  const teamsById = {};
  (teamRows||[]).forEach(t=>{ teamsById[t.id]=t; });

  const zoneColor = {};
  (standings.zones||[]).forEach((z,i)=>{ zoneColor[z.id] = z.color || ZONE_PALETTE[i % ZONE_PALETTE.length]; });

  const rows = [...standings.rows].sort((a,b)=>a.rank-b.rank);

  let html = `${sponsorBannerHtml(sponsor)}<div class="w-header">
    <div><div class="w-title">${escapeHtml(tRow.name)}${seasonKey?' '+escapeHtml(seasonKey):''}</div></div>
  </div>
  <table>
    <thead><tr>
      <th class="col-rank">#</th>
      <th class="col-team">${t('team')}</th>
      <th class="col-p">${t('p')}</th>
      <th class="col-w">${t('w')}</th>
      <th class="col-d">${t('d')}</th>
      <th class="col-l">${t('l')}</th>
      <th>${t('gd')}</th>
      <th>${t('pts')}</th>
    </tr></thead>
    <tbody>`;

  rows.forEach(r=>{
    const team = r.teamId ? teamsById[r.teamId] : null;
    const name = team?.name || r.name || 'Unknown';
    const diffCls = r.diff>0 ? 'pos' : r.diff<0 ? 'neg' : '';
    const diffText = r.diff>0 ? '+'+r.diff : r.diff;
    const bar = r.zoneId && zoneColor[r.zoneId] ? `<span class="zone-bar" style="background:${zoneColor[r.zoneId]}"></span>` : '';
    html += `<tr>
      <td class="col-rank">${bar}${r.rank}</td>
      <td class="col-team"><div class="team-cell">${teamBadge(team)}<span class="team-name">${escapeHtml(name)}</span></div></td>
      <td class="col-p">${r.played}</td>
      <td class="col-w">${r.w}</td>
      <td class="col-d">${r.d}</td>
      <td class="col-l">${r.l}</td>
      <td class="col-diff ${diffCls}">${diffText}</td>
      <td class="col-pts">${r.pts}</td>
    </tr>`;
  });

  html += `</tbody></table>`;

  if(standings.zones && standings.zones.length){
    html += `<div class="w-legend">`;
    standings.zones.forEach(z=>{
      html += `<div class="legend-item"><span class="legend-swatch" style="background:${zoneColor[z.id]}"></span>${escapeHtml(translateZoneLabel(z.label))}</div>`;
    });
    html += `</div>`;
  }

  el.innerHTML = html;
}

boot().catch(e=>{
  console.error(e);
  document.getElementById('widget').innerHTML = `<div class="w-error">Something went wrong loading standings.</div>`;
});
</script>
</body>
</html>
